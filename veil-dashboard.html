<meta charset="utf-8">
<title>VEIL — Campaign Intelligence</title>
<style>
  :root{
    --bg:#EEF0F1; --surface:#FFFFFF; --surface-2:#E4E7E9; --surface-3:#DADEE1;
    --ink:#14161A; --ink-2:#4B4F56; --ink-3:#7A7F87;
    --border:#D6DADD; --border-strong:#C2C7CB;
    --accent:#A6702C; --accent-ink:#FFFFFF; --accent-soft:#EFE1CB; --accent-soft-ink:#6B4A1C;
    --steel:#3E6478; --steel-soft:#DDE7EA;
    --good:#2F8F5B; --good-soft:#DCEFE2;
    --warn:#B9791E; --warn-soft:#F5E6CA;
    --crit:#C13B3B; --crit-soft:#F7DEDE;
    --shadow: 0 1px 2px rgba(20,22,26,.06), 0 8px 24px -12px rgba(20,22,26,.14);
    --radius: 3px;
    --font-display: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131418; --surface:#1B1D22; --surface-2:#23262C; --surface-3:#2B2E35;
      --ink:#EDEDEF; --ink-2:#B8BAC0; --ink-3:#7D818A;
      --border:#2E3138; --border-strong:#393D45;
      --accent:#D5A257; --accent-ink:#1B1508; --accent-soft:#332A18; --accent-soft-ink:#E6C793;
      --steel:#8FB3C6; --steel-soft:#1E2C32;
      --good:#5CB98A; --good-soft:#183226;
      --warn:#E0AC4D; --warn-soft:#33270F;
      --crit:#E2685F; --crit-soft:#391E1D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131418; --surface:#1B1D22; --surface-2:#23262C; --surface-3:#2B2E35;
    --ink:#EDEDEF; --ink-2:#B8BAC0; --ink-3:#7D818A;
    --border:#2E3138; --border-strong:#393D45;
    --accent:#D5A257; --accent-ink:#1B1508; --accent-soft:#332A18; --accent-soft-ink:#E6C793;
    --steel:#8FB3C6; --steel-soft:#1E2C32;
    --good:#5CB98A; --good-soft:#183226;
    --warn:#E0AC4D; --warn-soft:#33270F;
    --crit:#E2685F; --crit-soft:#391E1D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --bg:#EEF0F1; --surface:#FFFFFF; --surface-2:#E4E7E9; --surface-3:#DADEE1;
    --ink:#14161A; --ink-2:#4B4F56; --ink-3:#7A7F87;
    --border:#D6DADD; --border-strong:#C2C7CB;
    --accent:#A6702C; --accent-ink:#FFFFFF; --accent-soft:#EFE1CB; --accent-soft-ink:#6B4A1C;
    --steel:#3E6478; --steel-soft:#DDE7EA;
    --good:#2F8F5B; --good-soft:#DCEFE2;
    --warn:#B9791E; --warn-soft:#F5E6CA;
    --crit:#C13B3B; --crit-soft:#F7DEDE;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  a{ color:inherit; }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; }
  p{ margin:0; }
  ul{ margin:0; padding:0; list-style:none; }
  button{ font-family:inherit; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  /* ---- ruler strip ---- */
  .ruler{
    height:20px; display:flex; align-items:flex-end; overflow:hidden;
    border-bottom:1px solid var(--border); background:var(--surface-2);
    padding:0 0 3px 0;
  }
  .ruler .tick{ flex:1 0 auto; width:50px; border-left:1px solid var(--border-strong); height:7px; position:relative; }
  .ruler .tick:nth-child(6n+1){ height:11px; }
  .ruler .label{
    position:sticky; left:12px; font-family:var(--font-mono); font-size:9px; letter-spacing:.08em;
    color:var(--ink-3); text-transform:uppercase; padding-left:12px; white-space:nowrap;
  }

  /* ---- shell ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:220px; flex:0 0 220px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 16px 14px; border-bottom:1px solid var(--border); }
  .brand .mark{
    width:28px; height:28px; border-radius:2px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:13px;
    position:relative; flex:none;
  }
  .brand .mark::before, .brand .mark::after{ content:""; position:absolute; width:5px; height:5px; border:1px solid var(--accent-ink); opacity:.55; }
  .brand .mark::before{ top:2px; left:2px; border-right:0; border-bottom:0; }
  .brand .mark::after{ bottom:2px; right:2px; border-left:0; border-top:0; }
  .brand .word{ font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.02em; line-height:1.1; }
  .brand .sub{ font-family:var(--font-mono); font-size:10px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; }

  nav.sections{ padding:10px 8px; display:flex; flex-direction:column; gap:1px; flex:1; }
  nav.sections button{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:2px;
    font-size:12.5px; color:var(--ink-2); font-weight:600;
  }
  nav.sections button svg{ flex:none; opacity:.75; }
  nav.sections button:hover{ background:var(--surface-2); color:var(--ink); }
  nav.sections button.active{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  nav.sections button.active svg{ opacity:1; }
  nav.sections .n{ font-family:var(--font-mono); font-size:10px; color:var(--ink-3); width:14px; }
  nav.sections button.active .n{ color:var(--accent-soft-ink); }

  .sidebar-foot{ padding:12px 16px 16px; border-top:1px solid var(--border); }
  .health-row{ display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono); }
  .health-bar{ display:flex; height:6px; border-radius:2px; overflow:hidden; background:var(--surface-2); }
  .health-bar span{ height:100%; }
  .health-legend{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .health-legend .item{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-3); }
  .health-legend .dot{ width:6px; height:6px; border-radius:1px; }

  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:19px; }
  .topbar .tagline{ font-family:var(--font-mono); font-size:11px; color:var(--ink-3); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    font-family:var(--font-mono); white-space:nowrap;
  }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.crit{ background:var(--crit-soft); color:var(--crit); }
  .pill.steel{ background:var(--steel-soft); color:var(--steel); }
  .pill.accent{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-3); }
  .pill .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; }

  .content{ padding:24px 28px 80px; max-width:1180px; }
  .section{ display:none; flex-direction:column; gap:22px; }
  .section.active{ display:flex; }

  .eyebrow{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); font-weight:700; margin-bottom:4px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:20px; }
  .section-head .meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-3); }

  /* card w/ technical corner ticks */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 18px; position:relative; box-shadow:var(--shadow);
  }
  .card::before,.card::after{ content:""; position:absolute; width:7px; height:7px; pointer-events:none; }
  .card::before{ top:-1px; left:-1px; border-top:1.5px solid var(--accent); border-left:1.5px solid var(--accent); }
  .card::after{ bottom:-1px; right:-1px; border-bottom:1.5px solid var(--accent); border-right:1.5px solid var(--accent); }
  .card.flat{ box-shadow:none; }
  .card.flat::before,.card.flat::after{ display:none; }

  .grid{ display:grid; gap:14px; }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} .grid.cols-2{grid-template-columns:1fr;} }

  .hero-card{ padding:26px 26px; }
  .hero-card .core{ font-size:21px; font-weight:700; font-family:var(--font-display); line-height:1.35; max-width:62ch; }
  .hero-card .core b{ color:var(--accent); font-style:normal; }
  .hero-card .sub{ margin-top:10px; color:var(--ink-2); max-width:70ch; font-size:13.5px; }

  .stat-tile{ display:flex; flex-direction:column; gap:6px; }
  .stat-tile .label{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }
  .stat-tile .value{ font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-.02em; }
  .stat-tile .delta{ font-size:11.5px; color:var(--ink-2); }
  .stat-tile .delta.up{ color:var(--good); }

  h3.h{ font-size:14px; font-weight:700; margin-bottom:2px; }
  h4.h{ font-size:12.5px; font-weight:700; }
  .muted{ color:var(--ink-3); }
  .body-text{ color:var(--ink-2); font-size:13px; line-height:1.6; }

  /* priority list */
  .priority-row{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
  .priority-row:last-child{ border-bottom:none; }
  .priority-row .num{ font-family:var(--font-mono); font-size:12px; color:var(--ink-3); width:18px; flex:none; padding-top:1px; }
  .priority-row .body{ flex:1; min-width:0; }
  .priority-row .title-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .priority-row .title{ font-weight:700; font-size:13px; }
  .priority-row .why{ color:var(--ink-2); font-size:12.5px; margin-top:3px; }

  /* progress bar */
  .bar-row{ display:flex; align-items:center; gap:12px; }
  .bar-row .name{ width:150px; flex:none; font-size:12.5px; font-weight:600; }
  .bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:99px; position:relative; overflow:visible; }
  .bar-fill{ height:100%; border-radius:99px; background:var(--accent); position:relative; }
  .bar-target{ position:absolute; top:-3px; width:2px; height:14px; background:var(--ink); opacity:.4; }
  .bar-nums{ font-family:var(--font-mono); font-size:11px; color:var(--ink-3); width:120px; text-align:right; flex:none; }
  .bar-nums b{ color:var(--ink); font-weight:700; }

  /* workstream card */
  .ws-card{ display:flex; flex-direction:column; gap:10px; }
  .ws-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .ws-top .name{ font-size:13.5px; font-weight:700; }
  .ws-owner{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
  .ws-kpi{ font-size:12px; color:var(--ink-2); }
  .ws-track{ height:5px; background:var(--surface-2); border-radius:99px; }
  .ws-track span{ display:block; height:100%; border-radius:99px; background:var(--accent); }
  .ws-foot{ display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-3); }
  .ws-blockers{ display:flex; gap:6px; flex-wrap:wrap; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600; padding:0 12px 8px 0; border-bottom:1px solid var(--border-strong); }
  td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--border); vertical-align:top; color:var(--ink-2); }
  tr:last-child td{ border-bottom:none; }
  td.strong{ color:var(--ink); font-weight:600; }
  .table-wrap{ overflow-x:auto; }

  .chip{ display:inline-flex; padding:3px 9px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); font-size:11px; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }

  .timeline{ display:flex; gap:0; border-top:1px solid var(--border-strong); position:relative; }
  .phase{ flex:1; padding:16px 16px 0; border-left:1px solid var(--border); position:relative; }
  .phase:first-child{ border-left:none; }
  .phase::before{ content:""; position:absolute; top:-1px; left:-1px; width:9px; height:2px; background:var(--border-strong); }
  .phase.current::before{ background:var(--accent); width:100%; left:0; }
  .phase .dates{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); }
  .phase .pname{ font-weight:700; font-size:13.5px; margin:3px 0 8px; }
  .phase ul{ display:flex; flex-direction:column; gap:6px; }
  .phase li{ font-size:12px; color:var(--ink-2); padding-left:12px; position:relative; }
  .phase li::before{ content:""; position:absolute; left:0; top:6px; width:5px; height:1px; background:var(--ink-3); }
  @media (max-width:900px){ .timeline{ flex-direction:column; } .phase{ border-left:none; border-top:1px solid var(--border); padding:16px 0 0; } .phase::before{ display:none; } }

  .stack-bar{ display:flex; height:26px; border-radius:3px; overflow:hidden; border:1px solid var(--border); }
  .stack-seg{ display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:#fff; }
  .stack-legend{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .stack-legend .item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); }
  .stack-legend .sw{ width:10px; height:10px; border-radius:2px; }

  .accordion-item{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
  .accordion-item + .accordion-item{ margin-top:8px; }
  .accordion-head{ all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; width:100%; padding:13px 16px; cursor:pointer; font-weight:700; font-size:13px; }
  .accordion-head .chevron{ transition:transform .15s ease; color:var(--ink-3); }
  .accordion-item.open .accordion-head .chevron{ transform:rotate(90deg); }
  .accordion-body{ display:none; padding:0 16px 16px; }
  .accordion-item.open .accordion-body{ display:block; }
  .accordion-body pre{
    white-space:pre-wrap; font-family:var(--font-mono); font-size:12px; line-height:1.7; color:var(--ink-2);
    background:var(--surface-2); border-radius:2px; padding:14px; margin:0; border:1px solid var(--border);
  }

  .quote-block{ font-family:var(--font-mono); font-size:12px; color:var(--ink-2); background:var(--surface-2); border-left:2px solid var(--accent); padding:10px 12px; white-space:pre-wrap; line-height:1.6; }
  .callout{ display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); font-size:12.5px; align-items:flex-start; }
  .callout ul{ margin-top:4px; display:flex; flex-direction:column; gap:3px; }
  .callout li{ list-style:disc; margin-left:16px; display:list-item; }

  .rule-row{ display:grid; grid-template-columns:220px 1fr; gap:16px; padding:12px 0; border-bottom:1px solid var(--border); }
  .rule-row:last-child{ border-bottom:none; }
  .rule-row .rule{ font-weight:700; font-size:12.5px; }
  .rule-row .example{ font-size:12.5px; color:var(--ink-2); font-style:italic; }
  @media (max-width:760px){ .rule-row{ grid-template-columns:1fr; } }

  .scroll-x{ overflow-x:auto; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>

<div class="ruler" id="ruler"></div>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">N</div>
      <div>
        <div class="word">VEIL</div>
        <div class="sub">by NOWN</div>
      </div>
    </div>
    <nav class="sections" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="health-row"><span>Workstream health</span><span id="healthCount"></span></div>
      <div class="health-bar" id="healthBar"></div>
      <div class="health-legend">
        <span class="item"><span class="dot" style="background:var(--good)"></span>Active</span>
        <span class="item"><span class="dot" style="background:var(--steel)"></span>Planning</span>
        <span class="item"><span class="dot" style="background:var(--ink-3)"></span>Not started</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Campaign Intelligence — VEIL</h1>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="topbar-right" id="topbarRight"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

  brainstormOutputs: {
    "tagline-directions": "VEIL TAGLINE DIRECTIONS\n\nCORE POSITIONING: Customized by you. Elevated by our engineering. Standardized to fit.\nThe tagline formula drives everything — YOUR IDEA + OUR TOOLS = YOUR SIGNATURE DESIGN.\nThree beats. Three-beat rhythm is the brand voice. Use it at every altitude.\n\nPRIMARY TAGLINE (locked)\n\"YOUR IDEA + OUR TOOLS = YOUR SIGNATURE DESIGN.\"\nWhy: The equals sign makes the value exchange explicit. Three beats. Architect is the author. VEIL is the system.\n\nDirection 2 — PROCESS CADENCE\n\"Drawn in minutes, built in days, shipped in weeks.\"\nWhy: Time units are sticky and earned. Maps the full journey. Works for technical and general audiences.\n\nDirection 3 — THE ONE-OF-ONE\n\"One-of-one. Dropped into any grid.\"\nWhy: Names the unique-per-panel claim + the install ease in four words. Strong for spec and contractor audiences.\n\nDirection 4 — BRAND FOUNDATION\n\"Custom-perforated. Made to order. Simply Elevated.\"\nWhy: Three approved vocabulary terms. Parent tagline 'Simply Elevated' closes it. Works for brand-level surfaces.\n\nDirection 5 — SIMPLE CADENCE\n\"You design. We make. You install.\"\nWhy: DESIGN / BUILD / INSTALL in the simplest form. Architect-first framing. Good for onboarding and hero copy.\n\nRECOMMENDATION:\n— Primary: 'YOUR IDEA + OUR TOOLS = YOUR SIGNATURE DESIGN.' (product pages, social, email headers)\n— Process story: 'Drawn in minutes, built in days, shipped in weeks.' (campaign and ads)\n— Spec/B2B: 'Custom-perforated. Made to order. Simply Elevated.' (LinkedIn, press, spec sheets)\n— Paid ads: 'You design. We make. You install.' (clear, direct, conversion-optimized)\n\nVOCABULARY (use verbatim):\nDesign verbs: pick · drop in · dial in\nMake verbs: laser-cut · powder-coated · shipped\nInstall verb: drops into 600×1200 grid\nCategory: custom-perforated metal wall and ceiling tile\nTool: VEIL Studio (always with context on first mention)\nUnique claim: one-of-one",

    "instagram-post-ideas": "VEIL INSTAGRAM — 10 POST CONCEPTS\n\n1. THE REVEAL\nVisual: DOSE interface split with resulting panel.\nCaption: \"This started as a photograph. It became a wall. VEIL, coming soon.\"\nFlow: Intrigue\n\n2. THE SOURCE\nVisual: Original image next to perforation output.\nCaption: \"Your reference. Your pattern. No catalogue required.\"\nFlow: Intrigue → Reveal\n\n3. PROCESS REEL (30s)\nNo voiceover. Music only.\nSequence: upload → parameters → pattern → 3D view → DXF export.\nCaption: \"This is DOSE. Try it at nown.com/veil\"\nFlow: Reveal\n\n4. THE PARADOX POST\nVisual: Two panels side by side — identical system, different patterns.\nCaption: \"Same system. Different design. Every time.\"\nFlow: Proof\n\n5. LIGHT & SHADOW\nVisual: Light through perforated panel casting shadow pattern.\nCaption: \"What you design in DOSE, light reveals in the space.\"\nFlow: Intrigue\n\n6. CITY PATTERN SERIES (carousel)\nVisual: 5 panels — from photos of Amsterdam, Istanbul, London, Dubai, Berlin.\nCaption: \"5 cities. 5 patterns. Every city has a VEIL.\"\nFlow: Intrigue → Reveal\n\n7. THE SPEC DROP\nVisual: Close-up panel with overlaid specs.\nCaption: \"2.5mm pitch. 60% density. RAL 9005. Yours to adjust.\"\nFlow: Proof\n\n8. ACOUSTIC LAYER\nVisual: aSoft backer detail.\nCaption: \"Form and function are the same decision in VEIL.\"\nFlow: Proof\n\n9. STORY POLL\n\"Which pattern would you specify?\" — 2 DOSE-generated options.\nFlow: Action (engagement-driving)\n\n10. THE DXF\nVisual: DXF file open (architectural drawing feel).\nCaption: \"Configure. Export. Specify. Production-ready from DOSE.\"\nFlow: Action",

    "email-sequence": "VEIL EMAIL LAUNCH SEQUENCE — 5 EMAILS\n\nEMAIL 1 — THE INTRODUCTION (2 weeks before launch)\nSubject: \"Something new from NOWN. Your kind of new.\"\nContent: One DOSE-generated pattern image. 3 lines of copy. CTA: 'See VEIL'.\nFramework: Intrigue\n\nEMAIL 2 — THE DEMO (1 week before launch)\nSubject: \"This is what specifying VEIL feels like.\"\nContent: Animated GIF or video still of DOSE. 3-step process. CTA: 'Try DOSE'.\nFramework: Reveal\n\nEMAIL 3 — THE STORY (Launch day)\nSubject: \"How one image became a facade.\"\nContent: Short architect story or process case study. Real visuals. CTA: 'Request a sample'.\nFramework: Reveal + Proof\n\nEMAIL 4 — THE SPEC (3 days post-launch)\nSubject: \"VEIL: the numbers behind the design.\"\nContent: Technical summary card. DXF export call-out. Prominent sample CTA.\nFramework: Proof\n\nEMAIL 5 — THE OFFER (7 days post-launch)\nSubject: \"A sample, made from your configuration.\"\nContent: Sample request as the hero action. Custom sample framing.\nCTA: 'Order your VEIL sample' → /request-material-samples/\nFramework: Action\n\nRULES FOR ALL EMAILS:\n— Sample CTA in every send, even if secondary\n— Under 120 words per email\n— One DOSE-generated image per email\n— Statement or tension subject lines, never question marks",

    "pr-hooks": "VEIL PR HOOK DIRECTIONS\n\nFOR ARCHDAILY / DEZEEN (Online, global reach)\nAngle: 'The configurator that replaces the catalogue'\nHook: 'Most architectural perforation starts with a manufacturer's pattern library. VEIL reverses that. Architects upload any image — a photograph, a texture, a sketch — and DOSE translates it into a production-ready DXF. NOWN calls this a standardized customizable product: custom design inside a tested, fabrication-ready system.'\n\nFOR DETAIL MAGAZINE (German, technical audience)\nAngle: 'Precision customisation with structural confidence'\nHook: Lead with DXF workflow, fabrication specs, acoustic options. VEIL on Graphic Perf technical foundation. Include dimensional drawings. Editors here want the numbers.\n\nFOR FRAME MAGAZINE (Netherlands, Amsterdam market)\nAngle: 'A new design object from a new kind of manufacturer'\nHook: 'NOWN is carbon-negative. VEIL is custom. The combination makes a strong material story for Frame's design-material-space intersection.' Amsterdam is NOWN's top fan city — Frame's readership is the audience.\n\nFOR WALLPAPER* (Global, design-luxury)\nAngle: Visual-first. No product pitch.\nHook: Lead with the most beautiful DOSE-generated pattern. Get the image right. The copy is secondary to Wallpaper editors. One paragraph, no jargon.\n\nWHAT MAKES AN EDITOR CARE:\n— An installed project (not a render)\n— An architect willing to comment\n— A genuinely different process story\n— Images that look unlike anything else in the issue",

    "seo-ideas": "VEIL SEO STRATEGY — CONTENT IDEAS\n\nTARGET KEYWORDS (priority order):\n1. 'custom perforated metal panels' — product intent, high commercial value\n2. 'perforated facade design tool' — configurator intent, low competition\n3. 'image to perforation' — unique VEIL capability, own this term\n4. 'architectural metal screen custom' — broad, design-oriented\n5. 'VEIL perforated panels NOWN' — branded, protect it\n\nARTICLE 1 — HOW-TO (high traffic potential)\nTitle: 'How to specify custom perforated metal panels for architectural projects'\nIntent: Architect searching for guidance on custom perforation process.\nStructure: Problem → options → VEIL/DOSE solution → sample CTA.\n\nARTICLE 2 — EDITORIAL (thought leadership + links)\nTitle: 'Why architects are moving away from standard perforation catalogues'\nIntent: Awareness + positioning. Builds links from architecture blogs.\nStructure: Industry problem → shift in expectation → VEIL as natural answer.\n\nARTICLE 3 — COMPARISON (high-intent)\nTitle: 'VEIL vs. standard perforated panels: a specifier's guide'\nIntent: Architect comparing options. High conversion intent.\nStructure: Criteria table → VEIL advantage per criterion → CTA.\n\nQUICK WINS:\n— Optimize VEIL product page title tag and meta description\n— Add alt text to all DOSE-generated pattern images\n— Submit VEIL page to Google Search Console\n— Get ArchDaily article to link back to VEIL product page",

    "outreach-ideas": "VEIL CREATOR OUTREACH IDEAS\n\nTARGET PROFILE:\nArchitecture and interior design creators who document process, not just finished work. 5K–100K followers. EU + NA. They need to be credible to architects, not just popular.\n\nPHASE 1 — SILENT SEEDING (2 weeks before outreach)\nFollow 20 target creators. Like their most technical posts. Leave one genuine comment about their work. No pitch yet.\n\nPHASE 2 — THE DM\nNever start with 'collaboration opportunity'. Start with: 'We've been following your [specific project/post] — the way you [specific observation] is exactly the kind of thinking VEIL was made for.'\nThen: 'We'd like to send you something. No strings, no brief.'\n\nPHASE 3 — THE OBJECT\nSend The VEIL Design Object: custom A4 perforated metal sample, configured with their name or a photo they shared. Custom packaging.\nIncluded card: 'This pattern is yours. Configure the rest.'\n\nPHASE 4 — THE ASK (if they post about receiving it)\nFollow up with DOSE access. Ask if they'd like to configure their own pattern. Suggest: 'Show us what you'd make.'\n\nIDEA: VEIL PATTERN CHALLENGE\n5 creators, same day, each configure a pattern from their own photograph. All post simultaneously. Cross-tag each other. Hashtag: #VEILPattern.\nThis creates a content moment without paid media."

function buildRuler(){
  const r = $('#ruler');
  r.innerHTML = '<span class="label">600 × 1200 MODULE GRID</span>';
  for(let i=0;i<40;i++) r.appendChild(el('div','tick'));
}

function buildNav(){
  const nav = $('#nav');
  SECTIONS.forEach((s,i)=>{
    const b = el('button', i===0?'active':'', `<span class="n">${String(i+1).padStart(2,'0')}</span>${ICONS[s.id]}<span>${s.label}</span>`);
    b.dataset.id = s.id;
    b.addEventListener('click', ()=> showSection(s.id));
    nav.appendChild(b);
  });
}

function showSection(id){
  document.querySelectorAll('nav.sections button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+id));
}

function buildTopbar(){
  $('#tagline').textContent = DATA.positioning.currentTagline;

  right.innerHTML = `

  `;
}

function buildHealth(){
  const counts = { active:0, planning:0, 'not-started':0 };
  DATA.workstreams.forEach(w => counts[w.status] = (counts[w.status]||0)+1);
  const total = DATA.workstreams.length;
  const bar = $('#healthBar');
  bar.innerHTML = `
    <span style="width:${counts.active/total*100}%;background:var(--good)"></span>
    <span style="width:${counts.planning/total*100}%;background:var(--steel)"></span>
    <span style="width:${counts['not-started']/total*100}%;background:var(--ink-3)"></span>
  `;
  $('#healthCount').textContent = `${counts.active} active / ${total}`;
}

      </div>
    </div>

    <div class="callout" id="campaignMissing"></div>
  `;
  $('#content').appendChild(s);

  const tl = $('#phaseTimeline', s);
  DATA.campaign.phases.forEach(p=>{
    const d = el('div', 'phase'+(p.status==='current'?' current':''));
    d.innerHTML = `
      <div class="dates">${esc(p.dates)}</div>
      <div class="pname">${esc(p.name)} ${p.status==='current'?'<span class=\"pill accent\" style=\"margin-left:6px;\">current</span>':''}</div>
      <div class="pill steel" style="margin-bottom:10px;">${esc(p.flow)}</div>
      <ul>${p.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
    `;
    tl.appendChild(d);
  });

  const themeGrid = $('#themeGrid', s);
  DATA.campaign.contentThemes.forEach(t=>{
    const c = el('div','card');
    c.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <h4 class="h">${esc(t.theme)}</h4>
        <span class="pill accent">${esc(t.flow)}</span>
      </div>
      <div class="body-text" style="margin:8px 0 10px;">${esc(t.desc)}</div>
      <div class="chip-row">${t.channels.map(c2=>`<span class="chip">${esc(c2)}</span>`).join('')}</div>
    `;
    themeGrid.appendChild(c);
  });

  const colors = ['var(--accent)','var(--steel)','#6B8F71'];
  const stack = $('#paidStack', s);
  stack.innerHTML = DATA.paidAds.allocation.map((a,i)=>`<div class="stack-seg" style="width:${a.pct}%;background:${colors[i]};">${a.pct}%</div>`).join('');
  const legend = $('#paidLegend', s);
  legend.innerHTML = DATA.paidAds.allocation.map((a,i)=>`<span class="item"><span class="sw" style="background:${colors[i]}"></span>${esc(a.name)}</span>`).join('');

  const flow = $('#flowBudget', s);
  Object.entries(DATA.paidAds.campaignFlow).forEach(([k,v])=>{
    const row = el('div');
    row.innerHTML = `<div style="display:flex;gap:8px;align-items:baseline;"><span class="pill steel" style="min-width:70px;justify-content:center;">${esc(k)}</span><span class="body-text" style="font-size:12px;">${esc(v)}</span></div>`;
    flow.appendChild(row);
  });
  $('#testIdeas', s).innerHTML = DATA.paidAds.testIdeas.map(t=>`<li style="font-size:12px;color:var(--ink-2);padding-left:12px;position:relative;"><span style="position:absolute;left:0;top:6px;width:5px;height:1px;background:var(--ink-3);"></span>${esc(t)}</li>`).join('');

  $('#campaignMissing', s).innerHTML = `<div><strong>Missing before launch</strong><ul>${DATA.campaign.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;
}

function buildVault(){
  const s = sectionWrap('vault');
  s.innerHTML = `
    <div class="section-head">
      <div><div class="eyebrow">08 — Brainstorm Vault</div><h2>Raw working notes, unedited</h2></div>
      <div class="meta">${Object.keys(DATA.brainstormOutputs).length} documents</div>
    </div>
    <div id="vaultList"></div>
  `;
  $('#content').appendChild(s);

  const titleize = k => k.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
  const list = $('#vaultList', s);
  Object.entries(DATA.brainstormOutputs).forEach(([k,v],i)=>{
    const item = el('div','accordion-item'+(i===0?' open':''));
    item.innerHTML = `
      <button class="accordion-head">
        <span>${esc(titleize(k))}</span>
        <span class="chevron">›</span>
      </button>
      <div class="accordion-body"><pre>${esc(v)}</pre></div>
    `;
    item.querySelector('.accordion-head').addEventListener('click', ()=> item.classList.toggle('open'));
    list.appendChild(item);
  });
}
