  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ercase;color:#C6FF00;margin-bottom:20px;opacity:0;animation:fadeUp .8s ease .2s both}\n  .hero-title{font-size:clamp(56px,9vw,128px);font-weight:700;letter-spacing:-.045em;line-height:.88;opacity:0;animation:fadeUp .9s ease .4s both}\n  .hero-sub{font-size:clamp(15px,1.6vw,20px);line-height:1.75;color:#aaa;max-width:560px;margin-top:28px;opacity:0;animation:fadeUp .8s ease .7s both}\n  .hero-nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px;opacity:0;animation:fadeUp .7s ease 1s both}\n  .sec-pill{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border:1px solid #444;color:#ccc;cursor:pointer;transition:border-color .2s,color .2s,background .2s}\n  .sec-pill:hover,.sec-pill.active{border-color:#C6FF00;color:#000;background:#C6FF00}\n\n  /* sections */\n  section.story-sec{padding:100px 36px;position:relative;overflow:hidden;border-top:1px solid #111}\n  .sec-inner{max-width:1060px;margin:0 auto}\n  .sec-tag{display:flex;align-items:center;gap:14px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:52px}\n  .sec-tag::after{content:'';flex:1;height:1px;background:#1e1e1e}\n  .sec-num{color:#C6FF00}\n  .sec-lbl{color:#aaa}\n  .grid-bg{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 80px)}\n\n  /* origin preview */\n  .origin-card{display:grid;grid-template-columns:1fr 380px;gap:36px;align-items:center;border:1px solid #1e1e1e;padding:48px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .3s}\n  .origin-card:hover{border-color:#C6FF00}\n  .origin-card-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(198,255,0,.04),transparent 70%);transition:opacity .4s}\n  .origin-card:hover .origin-card-bg{opacity:2}\n  .origin-label{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#C6FF00;margin-bottom:16px}\n  .origin-title{font-size:clamp(32px,4vw,54px);font-weight:700;letter-spacing:-.035em;line-height:.94;color:#fff;margin-bottom:20px}\n  .origin-arabic{font-size:clamp(18px,2.5vw,32px);color:#C6FF00;direction:rtl;margin-bottom:24px}\n  .origin-teaser{font-size:15px;line-height:1.8;color:#ccc;max-width:440px}\n  .origin-cta{display:inline-flex;align-items:center;gap:10px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#000;background:#C6FF00;padding:12px 18px;font-weight:700;margin-top:28px;transition:background .2s,color .2s}\n  .origin-cta:hover{background:transparent;color:#C6FF00;box-shadow:inset 0 0 0 1px #C6FF00}\n  .origin-cta .arr{display:inline-block;transition:transform .3s cubic-bezier(.22,1,.36,1)}\n  .origin-cta:hover .arr{transform:translateX(4px)}\n  .origin-visual{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}\n  .origin-vert-line{width:1px;height:280px;background:linear-gradient(to bottom,transparent,#C6FF00,transparent);margin:0 auto}\n  .origin-dot{width:8px;height:8px;border-radius:50%;background:#C6FF00;box-shadow:0 0 12px 3px rgba(198,255,0,.5);margin:0 auto;flex:none}\n  .origin-node{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#C6FF00;text-align:center;padding:4px 0}\n\n  /* timeline */\n  .timeline{position:relative;padding-left:0}\n  .tl-spine{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:1px;background:#1a1a1a}\n  .tl-fill{position:absolute;left:50%;transform:translateX(-50%);top:0;width:1px;background:#C6FF00;box-shadow:0 0 6px 2px rgba(198,255,0,.4);height:0;transition:height .12s linear}\n  .tl-item{display:grid;grid-template-columns:1fr 48px 1fr;margin-bottom:0;padding:48px 0;opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}\n  .tl-item.vis{opacity:1;transform:translateY(0)}\n  .tl-item.left .tl-content{grid-column:1;text-align:right;padding-right:40px}\n  .tl-item.left .tl-node{grid-column:2}\n  .tl-item.left .tl-empty{grid-column:3}\n  .tl-item.right .tl-empty{grid-column:1}\n  .tl-item.right .tl-node{grid-column:2}\n  .tl-item.right .tl-content{grid-column:3;padding-left:40px}\n  .tl-node{display:flex;justify-content:center;align-items:flex-start;padding-top:6px}\n  .tl-dot{width:14px;height:14px;border-radius:50%;background:#000;border:2px solid #333;transition:border-color .4s,box-shadow .4s;flex:none}\n  .tl-item.vis .tl-dot{border-color:#C6FF00;box-shadow:0 0 10px 2px rgba(198,255,0,.4)}\n  .tl-year{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#C6FF00;margin-bottom:8px}\n  .tl-role{font-size:clamp(17px,1.9vw,22px);font-weight:700;letter-spacing:-.02em;color:#fff;margin-bottom:4px}\n  .tl-org{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#aaa;margin-bottom:12px}\n  .tl-desc{font-size:14px;line-height:1.75;color:#ccc;max-width:360px}\n  .tl-item.right .tl-desc{margin-left:0}\n  .tl-tag{display:inline-block;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#C6FF00;border:1px solid #C6FF00;padding:3px 8px;margin-top:10px}\n\n  /* reveal */\n  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}\n  .reveal.vis{opacity:1;transform:translateY(0)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"cursor\"><\u002Fdiv>\n\n<nav>\n  <span class=\"nav-name\">Essia Zarrouk<\u002Fspan>\n  <div class=\"nav-links\">\n    <a href=\"index.html\">Portfolio<\u002Fa>\n    <a href=\"Personal Page.html\">Personal<\u002Fa>\n    <a href=\"index.html#contact\">Contact<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- Hero -->\n<section id=\"hero\">\n  <div class=\"hero-grid\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;max-width:1060px;margin:0 auto;width:100%\">\n    <div class=\"hero-eyebrow\">About me · Essia Zarrouk<\u002Fdiv>\n    <h1 class=\"hero-title\">Who I am<br><span style=\"color:#C6FF00\">+ how I got here<\u002Fspan><\u002Fh1>\n    <p class=\"hero-sub\">Brand and campaigns marketer who keeps creative and commercial speaking the same language. A film lover's eye for story, a puzzler's instinct for making the pieces fit.<\u002Fp>\n    <div class=\"hero-nav\">\n      <a href=\"#origin\" class=\"sec-pill\">Origin story<\u002Fa>\n      <a href=\"#education\" class=\"sec-pill\">Education<\u002Fa>\n      <a href=\"#experience\" class=\"sec-pill\">Experience<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 Origin Story -->\n<section class=\"story-sec\" id=\"origin\">\n  <div class=\"grid-bg\"><\u002Fdiv>\n  <div class=\"sec-inner\" style=\"position:relative;z-index:1\">\n    <div class=\"sec-tag reveal\">\n      <span class=\"sec-num\">[ 01 ]<\u002Fspan>\n      <span class=\"sec-lbl\">Origin Story<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"Origin Story.html\" class=\"origin-card reveal\" style=\"text-decoration:none;display:grid\">\n      <div class=\"origin-card-bg\"><\u002Fdiv>\n      <div style=\"position:relative;z-index:1\">\n        <div class=\"origin-label\">Al Jabal Al Akhdar · Oman · 2,000 years of water<\u002Fdiv>\n        <div class=\"origin-title\">The<br>Green Mountain<\u002Fdiv>\n        <div class=\"origin-arabic\">الجبل الأخضر<\u002Fdiv>\n        <p class=\"origin-teaser\">It rises two thousand metres over the Omani desert. The secret is the aflaj — ancient channels that carry water precisely where it needs to go, making things grow where nothing should. That mountain is how I work.<\u002Fp>\n        <div class=\"origin-cta\">Read the full story <span class=\"arr\">↗<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"origin-visual\" style=\"position:relative;z-index:1\">\n        <div class=\"origin-node\">[ the mountain ]<\u002Fdiv>\n        <div class=\"origin-vert-line\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;margin:0\">\n          <div style=\"width:40px;height:1px;background:linear-gradient(to right,transparent,#C6FF00)\"><\u002Fdiv>\n          <div class=\"origin-dot\"><\u002Fdiv>\n          <div style=\"width:40px;height:1px;background:linear-gradient(to left,transparent,#C6FF00)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:24px;width:1px;background:linear-gradient(to bottom,#C6FF00,transparent);margin:0 auto\"><\u002Fdiv>\n        <div class=\"origin-node\" style=\"color:#aaa\">[ aflaj ]<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;text-align:center;margin-top:16px;line-height:1.6\">6 beats<br>scroll to follow<br>the water<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 Education -->\n<section class=\"story-sec\" id=\"education\">\n  <div class=\"grid-bg\"><\u002Fdiv>\n  <div class=\"sec-inner\" style=\"position:relative;z-index:1\">\n    <div class=\"sec-tag reveal\">\n      <span class=\"sec-num\">[ 02 ]<\u002Fspan>\n      <span class=\"sec-lbl\">Educational Journey<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative\" id=\"edu-timeline\">\n      <div class=\"tl-spine\"><\u002Fdiv>\n      <div class=\"tl-fill\" id=\"edu-fill\"><\u002Fdiv>\n\n      <div class=\"tl-item left\">\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">2015 — 2019<\u002Fdiv>\n          <div class=\"tl-role\">Secondary Education · A-Levels<\u002Fdiv>\n          <div class=\"tl-org\">Alshomoukh International School (British Curriculum) · Oman<\u002Fdiv>\n          <p class=\"tl-desc\">A-Levels: Economics, Statistics, Art — plus Physics, Mathematics, and Business Studies. Three disciplines everyone found surprising, but that felt obvious: one tells you what's working, the third trains your eye to see, and the middle one connects them.<\u002Fp>\n          <span class=\"tl-tag\">Graduated early · Oman<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-empty\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item right\">\n        <div class=\"tl-empty\"><\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">2019 — 2022<\u002Fdiv>\n          <div class=\"tl-role\">BSc International Media &amp; Communication<\u002Fdiv>\n          <div class=\"tl-org\">Erasmus University Rotterdam · Netherlands<\u002Fdiv>\n          <p class=\"tl-desc\">Specialisation: Media &amp; Business. Moved to the Netherlands alone before eighteen. Studied media strategy, brand communications, and business — building real-world experience through placements alongside degree work.<\u002Fp>\n          <span class=\"tl-tag\">Rotterdam · Media &amp; Business<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 Experience -->\n<section class=\"story-sec\" id=\"experience\">\n  <div class=\"grid-bg\"><\u002Fdiv>\n  <div class=\"sec-inner\" style=\"position:relative;z-index:1\">\n    <div class=\"sec-tag reveal\">\n      <span class=\"sec-num\">[ 03 ]<\u002Fspan>\n      <span class=\"sec-lbl\">Professional Journey<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative\" id=\"exp-timeline\">\n      <div class=\"tl-spine\"><\u002Fdiv>\n      <div class=\"tl-fill\" id=\"exp-fill\"><\u002Fdiv>\n\n      <div class=\"tl-item right\">\n        <div class=\"tl-empty\"><\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Mar 2021 — Oct 2022<\u002Fdiv>\n          <div class=\"tl-role\">Social Media Intern<\u002Fdiv>\n          <div class=\"tl-org\">WFTO · World Fair Trade Organization<\u002Fdiv>\n          <p class=\"tl-desc\">Managed digital campaigns promoting global fair-trade initiatives. Created and scheduled content to strengthen outreach and stakeholder engagement. Supported data-driven planning and post-campaign analysis.<\u002Fp>\n          <span class=\"tl-tag\">Social · Cause · Content<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item left\">\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Mar 2022 — Aug 2022<\u002Fdiv>\n          <div class=\"tl-role\">Branding &amp; Communications<\u002Fdiv>\n          <div class=\"tl-org\">Joolz · Amsterdam<\u002Fdiv>\n          <p class=\"tl-desc\">Assisted in brand development and visual communication strategy. Supported event coordination and campaign production inside a premium, design-led brand identity — discipline: consistency and restraint.<\u002Fp>\n          <span class=\"tl-tag\">Brand · Premium<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-empty\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item right\">\n        <div class=\"tl-empty\"><\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Sep 2022 — Feb 2023<\u002Fdiv>\n          <div class=\"tl-role\">Marketing Executive<\u002Fdiv>\n          <div class=\"tl-org\">Wright Brothers Flight Technology · Hoofddorp<\u002Fdiv>\n          <p class=\"tl-desc\">Managed marketing plans, social media, and event planning within a sales &amp; marketing team. Ran digital campaigns; created and scheduled content. Supported data-driven planning and post-campaign analysis to improve ROI.<\u002Fp>\n          <span class=\"tl-tag\">Digital · Events · ROI<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item left\">\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Mar 2023 — Sep 2023<\u002Fdiv>\n          <div class=\"tl-role\">Marketing &amp; Content Specialist<\u002Fdiv>\n          <div class=\"tl-org\">ChatLicense · Rotterdam<\u002Fdiv>\n          <p class=\"tl-desc\">Developed and executed social media and content strategy across LinkedIn, TikTok, and in-app. Produced marketing materials and blog content. Conducted market and audience research to support brand growth. Contributed to product development and user testing with schools in the Netherlands.<\u002Fp>\n          <span class=\"tl-tag\">EdTech · Social · Product<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-empty\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item right\">\n        <div class=\"tl-empty\"><\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Sep 2023 — Jan 2025<\u002Fdiv>\n          <div class=\"tl-role\">Account Executive<\u002Fdiv>\n          <div class=\"tl-org\">EMG · Amsterdam<\u002Fdiv>\n          <p class=\"tl-desc\">Managed global B2B client portfolios (chemicals, energy, industrial) including OQ, Songwon, ClearCorrect, and Westfalia. Coordinated stakeholders, delivered digital marketing reports, and stepped up to own budget allocation, utilisation tracking, and pricing when the manager transitioned.<\u002Fp>\n          <span class=\"tl-tag\">B2B · Global · Agency<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item left\">\n        <div class=\"tl-content\">\n          <div class=\"tl-year\">Jan 2025 — present<\u002Fdiv>\n          <div class=\"tl-role\">Marketing &amp; Brand Manager<\u002Fdiv>\n          <div class=\"tl-org\">NOWN · Amsterdam<\u002Fdiv>\n          <p class=\"tl-desc\">Own brand strategy and market positioning across EMEA. Lead multi-channel campaigns and creative direction for product launches. Assigned as Product Manager for the Veil product line. Manage creative teams, web developers, and production. Market research, lead generation, CRM/SEO, and website management.<\u002Fp>\n          <span class=\"tl-tag\">Current · Brand lead · PM<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tl-node\"><div class=\"tl-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"tl-empty\"><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer style=\"border-top:1px solid #111;padding:20px 36px;display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#444;background:#000\">\n  <span style=\"color:#fff;font-weight:700\">Essia Zarrouk<\u002Fspan>\n  <a href=\"index.html#contact\" style=\"color:#C6FF00\">Let's chat ↗<\u002Fa>\n  <span>©2026<\u002Fspan>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // Cursor\n    const cur = document.getElementById('cursor');\n    let lx=0,ly=0,cx=0,cy=0;\n    document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;});\n    (function loop(){ lx+=(cx-lx)*.12; ly+=(cy-ly)*.12; cur.style.left=lx+'px'; cur.style.top=ly+'px'; requestAnimationFrame(loop); })();\n    document.querySelectorAll('a,button,.sec-pill').forEach(el=>{\n      el.addEventListener('mouseenter',()=>cur.classList.add('big'));\n      el.addEventListener('mouseleave',()=>cur.classList.remove('big'));\n    });\n\n    // Nav pill active\n    const pills = document.querySelectorAll('.sec-pill');\n    const secs  = ['origin','education','experience'].map(id=>document.getElementById(id));\n    window.addEventListener('scroll',()=>{\n      const sy=window.scrollY;\n      secs.forEach((s,i)=>{ if(s) pills[i].classList.toggle('active', sy>=s.offsetTop-120); });\n    },{passive:true});\n\n    // Scroll reveals\n    const obs = new IntersectionObserver(entries=>{\n      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('vis'); obs.unobserve(e.target); }});\n    },{threshold:0.12});\n    document.querySelectorAll('.reveal,.tl-item').forEach(el=>obs.observe(el));\n\n    // Timeline fill on scroll\n    const fillTimeline = (wrapperId, fillId) => {\n      const wrap = document.getElementById(wrapperId);\n      const fill = document.getElementById(fillId);\n      if(!wrap||!fill) return;\n      const update = () => {\n        const r   = wrap.getBoundingClientRect();\n        const vH  = window.innerHeight;\n        const pct = Math.max(0, Math.min(100, (vH - r.top) / r.height * 100));\n        fill.style.height = pct + '%';\n      };\n      window.addEventListener('scroll', update, {passive:true});\n      update();\n    };\n    fillTimeline('edu-timeline','edu-fill');\n    fillTimeline('exp-timeline','exp-fill');\n  }\n  renderVals(){ return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
