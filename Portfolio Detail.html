coordination. As the assigned PM, I sat at the centre — connecting design, development, production, and marketing — making the calls and holding the timeline so every function moved as one.\n\nFramework. Full-lifecycle product management at the intersection of business, technology, and UX. A product manager owns the outcome, not a single function — coordinating design, engineering, production, and go-to-market around one roadmap. Veil is a textbook case of managing a phygital product: a physical system and a digital configurator developed in parallel, where the PM's job is to keep the hardware, the software, and the market story converging on the same launch.\n\nResult. Veil brought to market end to end — physical system produced, configuration tool built and shipped, and launch delivered — with one person, assigned by the CEO, owning the product from concept to customer.`\n      },\n      {\n        title:  \"Product Development & Content Management — ChatLicense\",\n        client: \"ChatLicense\",\n        year: \"2023\",\n        tags:   [\"Product Management\",\"Research & Insight\",\"Content & Copy\"],\n        tools:  [\"ClickUp\",\"GA4\"],\n        role:   \"Product Management\",\n        desc:   `Challenge. ChatLicense was a soon-to-launch digital-literacy app that needed both product development and a steady pipeline of in-app content to be ready for market — building the product and filling it with what users would actually engage with.\n\nApproach. I contributed across the product's development lifecycle: Build the product. I worked as part of the development team, contributing to the app itself as it moved toward launch. Develop the content layer. I created the animations, games, shows, and blogs that populated the product — the content that made the app worth opening. Validate with users. I ran market research and tested the app with multiple schools in the Netherlands, gathering user feedback to refine and improve the product before launch. Manage delivery. I handled content management, logistics, and promotional efforts, keeping the product's moving parts coordinated.\n\nFramework. Iterative, user-centred product development. Good products are built in a loop — develop, test with real users, gather feedback, refine — rather than shipped blind. Testing with schools and feeding that feedback back into the product is user-centred development in practice. Owning both the build and the content layer meant managing the product as a whole experience, not just its features.\n\nResult. Contributed to taking ChatLicense from pre-launch toward market — a developed, user-tested product with a full content layer, shaped by real feedback from its target audience.`\n      }\n    ],\n\n    \"06\": [\n      {\n        title:  \"NOWN · Marketing OS — Unified Analytics Dashboard (built with Claude Code)\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Analytics & Performance\",\"Product Management\"],\n        tools:  [\"Claude Code\",\"GitHub\",\"GA4\",\"Electron/Tauri\"],\n        role:   \"Analytics & Performance\",\n        desc:   `Challenge. NOWN's marketing data lived in silos — social media stats, email marketing performance, and GA4 traffic all in separate places. There was no single view of how marketing was actually performing, which made reporting slow and decisions harder.\n\nApproach. I used Claude Code to build a unified dashboard — \"NOWN Marketing OS\" — that brings social, email, and GA4 analytics into one space:\n\n1. One source of truth. Built it as a single codebase in one GitHub repo, with full version history — nothing living only in a browser tab.\n\n2. A real, installable tool. Architected it to be packaged as a downloadable desktop app (wrapping the dashboard with Electron/Tauri, the same tech behind Slack and VS Code), with GitHub Actions set up to auto-build the installer and support self-updates.\n\n3. Local-first, centrally synced. Architected it to work offline with a local database, syncing to a shared cloud database so the whole team sees the same live data — with live API pulls (GA4, Instagram, LinkedIn, Pinterest) replacing manual copy-paste over time.\n\nFramework. Marketing-ops tooling / build-vs-buy. Rather than paying for a dashboard product, I built a fit-for-purpose internal tool — sequenced sensibly (prove it as a web app first, then wrap it as a desktop app). It's the marketer-who-can-build: solving an ops problem with software instead of a spreadsheet.\n\nResult. A unified marketing analytics dashboard that gives NOWN one live view across every channel — built with AI-assisted development, versioned on GitHub, and architected to grow into a self-updating team app.`\n      },\n      {\n        title:  \"NOWN · AI Lead-Scouting Tool for Architects (built with Claude + API)\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Analytics & Performance\",\"Content & Copy\",\"Account Management\"],\n        tools:  [\"Claude API\",\"MS Dynamics\"],\n        role:   \"Analytics & Performance\",\n        desc:   `Challenge. NOWN's target customers are architects and designers — and the ideal moment to reach them is right after a building permit is approved, when they're about to choose suppliers. But finding those leads manually, at the right moment, across a region is slow and easy to miss.\n\nApproach. I built an AI-powered lead-scouting tool using Claude with an API key, focused on the UK region:\n\n1. Scout permits automatically. The tool monitors specified sites for newly approved building permits and pulls the key details — budget, size, building type, submitting party, and the architecture firm involved.\n\n2. Identify and enrich the lead. It captures the right contact — the design firm or the person who submitted — and feeds that data into our CRM, growing our pipeline with timely, qualified leads.\n\n3. Personalised outreach at scale. It generates personalised-but-automated outreach to each contact, so we reach hot leads at exactly the moment they're choosing suppliers.\n\nFramework. AI-driven lead generation / intent-timing. The tool combines automated data scouting, CRM enrichment, and personalised outreach into one pipeline — reaching prospects at the precise moment of buying intent (permit approved → supplier selection). It's demand generation engineered around timing, powered by AI.\n\nResult. An automated system that feeds NOWN's CRM with fresh, qualified architect and designer leads at the ideal moment — putting the brand in front of decision-makers exactly when they're choosing suppliers, using AI to do at scale what would be impossible manually.`\n      }\n    ]\n  },\n\n  // ── PERSONAL ────────────────────────────────────────────\n  personal: {\n    qualities: [\"resilient\",\"accountable\",\"kind\",\"curious\",\"precise\",\"bold\",\"warm\",\"collaborative\",\"analytical\",\"creative\"],\n\n    about: {\n      intro: \"Born in Tunisia, raised in Oman, and moved to the Netherlands alone before eighteen. I grew up switching between languages, countries, and cultures — and learned to read people and earn their trust quickly. That became my comfort zone, and the real engine of everything I do.\",\n      items: [\n        { label:\"Origin\", desc:\"They call it Al Jabal Al Akhdar — the Green Mountain. It rises two thousand metres over the Omani desert. I hiked it as a teenager and somewhere on those slopes it clicked: read the terrain, bring people together, and channel things where they need to go so something actually grows.\" },\n        { label:\"Background\", desc:\"Born in Tunisia, taught in French till six, then Oman for a British school. Graduated a year early and moved to the Netherlands on my own before I turned eighteen. When you grow up switching between languages, countries, and cultures, you learn to read people fast — and that became my comfort zone.\" },\n        { label:\"The two halves\", desc:\"My father worked in theatre and cinema — I was raised around design, story, and the craft of making people feel something. My mother worked in business — at the same table I fell for numbers and the satisfaction of things adding up. My A-levels were Economics, Statistics, and Art. One tells you the truth; the other makes people care. I've never treated them as opposites.\" }\n      ]\n    },\n\n    projects: {\n      intro: \"Things I built outside of client work — on my own terms, with no brief but my own.\",\n      items: [\n        { label:\"Shabab (شباب)\", desc:\"A personal brand world built from North-African heritage — Arabic for 'youth'. I conceptualised and art-directed the project end to end, blending photography and graphic design into one coherent visual identity. Culture as the foundation, not the finish.\" },\n        { label:\"Casa Swana\", desc:\"A podcast I created and produce with a friend, exploring cultural trends and identity across the CASA and SWANA region. I co-developed the concept, ran the full production (studio, sound, recording, edit), and led the editorial — building relatability and cultural authenticity into the foundation, not bolting it on afterwards.\" }\n      ]\n    },\n\n    values: {\n      intro: \"What I stand for and how I show up.\",\n      items: [\n        { label:\"Resilience\", desc:\"I moved countries, switched languages, and started over more than once before I was eighteen. I stay steady when things get complicated, and I finish what I start.\" },\n        { label:\"Accountability\", desc:\"If it's mine, I own it — the wins and the parts that go wrong. I'd rather name a problem early and fix it than let it quietly compound. People trust me because they know I'll follow through and tell them the truth.\" },\n        { label:\"Kindness\", desc:\"I think you can be direct and kind — they're not opposites. I lead and give feedback in a way that keeps people's dignity intact, because the best work happens when people feel respected, not managed.\" },\n        { label:\"Collaboration\", desc:\"I'm at my best in the middle of a team, connecting people who don't naturally speak the same language and getting them working toward the same thing. I've never believed the best ideas come from one person in a room.\" }\n      ]\n    },\n\n    hobbies: {\n      intro: \"What I do for fun — the human stuff.\",\n      items: [\n        { label:\"Photography\", desc:\"I shoot to train my eye. I pay attention to how light, composition, and timing make an image land — a running education in what good actually looks like.\" },\n        { label:\"Film\", desc:\"I watch like a student, not just a viewer — noticing how framing, colour, and pace move people. It's where a lot of my visual reference and taste come from.\" },\n        { label:\"Art Direction\", desc:\"Where a trained eye becomes useful. I love shaping how something looks and feels until it says the right thing — and I can tell when something's on-brand or off, and say exactly why.\" },\n        { label:\"Reading\", desc:\"My steadiest habit, and where a lot of my range comes from. Good stories are just good insight in disguise.\" },\n        { label:\"Puzzles\", desc:\"I'm happiest with a problem to untangle. I love the moment scattered pieces suddenly click into a whole — which is honestly my favourite part of the job too.\" },\n        { label:\"Running\", desc:\"My reset, and my proof to myself that I finish what I start. It's discipline with no audience — the same steadiness that keeps me calm and keeps a project moving when everything gets complicated.\" }\n      ]\n    }\n  }\n};\n<\u002Fscript>\n<style>\n  .rail::-webkit-scrollbar{height:6px}\n  .rail::-webkit-scrollbar-thumb{background:#C6FF00}\n  .rail::-webkit-scrollbar-track{background:#1a1a1a}\n  .sec-pill{\n    overflow:hidden;max-height:38px;\n    transition:max-height .52s cubic-bezier(.22,1,.36,1),background .22s ease;\n    border:1px solid #1e1e1e;cursor:default;\n  }\n  .sec-pill:hover{max-height:600px;background:#0e0e0e;}\n  .sec-pill:hover .sec-hint{opacity:0}\n  .sec-pill:hover .sec-label{color:#C6FF00}\n  .sec-label{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#C6FF00;width:90px;flex:none;transition:color .22s}\n  .sec-hint{font-family:ui-monospace,monospace;font-size:9px;color:#888;transition:opacity .22s}\n  .sec-text{font-size:14px;line-height:1.9;color:#ccc;padding:10px 18px 20px 122px;margin:0;white-space:pre-line}\n  @keyframes slideUp{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}\n  @keyframes fadeIn{from{opacity:0}to{opacity:1}}\n  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}\n<\u002Fstyle>\n<style>*{cursor:none!important}<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"custom-cursor\" style=\"position:fixed;top:0;left:0;width:14px;height:14px;border-radius:50%;background:#C6FF00;pointer-events:none;z-index:999999;transform:translate(-50%,-50%);transition:width .25s cubic-bezier(.16,1,.3,1),height .25s cubic-bezier(.16,1,.3,1),opacity .2s ease;opacity:1\"><\u002Fdiv>\n<script>\n(function(){\n  if(window.__essiaCursorInit) return;\n  window.__essiaCursorInit = true;\n  if(matchMedia('(pointer: coarse)').matches) return;\n  let x=0,y=0,cx=0,cy=0;\n  window.addEventListener('mousemove', e=>{\n    x=e.clientX; y=e.clientY;\n    const c=document.getElementById('custom-cursor'); if(c) c.style.opacity='1';\n  });\n  document.documentElement.addEventListener('mouseleave', ()=>{ const c=document.getElementById('custom-cursor'); if(c) c.style.opacity='0'; });\n  function loop(){\n    cx += (x-cx)*0.18; cy += (y-cy)*0.18;\n    const c=document.getElementById('custom-cursor');\n    if(c){ c.style.left=cx+'px'; c.style.top=cy+'px'; }\n    requestAnimationFrame(loop);\n  }\n  loop();\n  const targets = 'a, button, [onclick], input, textarea';\n  document.addEventListener('mouseover', e=>{\n    if(e.target.closest && e.target.closest(targets)){\n      const c=document.getElementById('custom-cursor');\n      if(c){ c.style.width='40px'; c.style.height='40px'; c.style.background='transparent'; c.style.border='2px solid #C6FF00'; }\n    }\n  });\n  document.addEventListener('mouseout', e=>{\n    if(e.target.closest && e.target.closest(targets)){\n      const c=document.getElementById('custom-cursor');\n      if(c){ c.style.width='14px'; c.style.height='14px'; c.style.background='#C6FF00'; c.style.border='none'; }\n    }\n  });\n})();\n<\u002Fscript>\n\n<div style=\"min-height:100vh;background:#0a0a0a;color:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased\">\n\n  <!-- nav -->\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid #1e1e1e;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;background:#0a0a0a;z-index:50\">\n    <a href=\"index.html\" style=\"font-weight:700;color:#fff;text-decoration:none\">Essia Zarrouk<\u002Fa>\n    <span style=\"display:flex;gap:24px;color:#aaa\">\n      <a href=\"index.html\" style=\"color:#aaa;text-decoration:none\">Profile<\u002Fa>\n      <span style=\"color:#C6FF00\">Portfolio<\u002Fspan>\n      <a href=\"Personal Page.html\" style=\"color:#aaa;text-decoration:none\">Personal<\u002Fa>\n      <a href=\"Essia Zarrouk Resume.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#aaa;text-decoration:none\">Resume ↗<\u002Fa>\n    <\u002Fspan>\n    <a href=\"index.html#contact\" style=\"color:#fff;text-decoration:none\">Contact ↗<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- header -->\n  <div style=\"padding:48px 28px 32px;border-bottom:1px solid #1e1e1e;max-width:1100px;margin:0 auto;width:100%\">\n    <div style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#C6FF00;margin-bottom:16px\">Portfolio · All projects<\u002Fdiv>\n    <h1 style=\"font-size:clamp(36px,5vw,68px);font-weight:700;letter-spacing:-.04em;line-height:.9;margin-bottom:18px\">Selected work<\u002Fh1>\n    <p style=\"font-size:15px;line-height:1.75;color:#aaa;max-width:520px\">{{ intro }}<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- tag filter bar -->\n  <div style=\"padding:20px 28px;border-bottom:1px solid #1e1e1e;max-width:1100px;margin:0 auto;width:100%\">\n    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px\">\n      <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;min-width:80px\">Skill<\u002Fspan>\n      <sc-for list=\"{{ tagChips }}\" as=\"chip\" hint-placeholder-count=\"13\">\n        <button style=\"{{ chip.style }}\" sc-camel-on-click=\"{{ chip.onClick }}\">{{ chip.label }} <span style=\"font-size:10px;opacity:.85\">{{ chip.count }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #111\">\n      <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;min-width:80px\">Tool<\u002Fspan>\n      <sc-for list=\"{{ toolChips }}\" as=\"tc\" hint-placeholder-count=\"8\">\n        <button style=\"{{ tc.style }}\" sc-camel-on-click=\"{{ tc.onClick }}\">{{ tc.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- project count -->\n  <div style=\"padding:16px 28px 0;max-width:1100px;margin:0 auto;width:100%;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555\">\n    {{ projectCount }} projects · {{ activeTag }}\n  <\u002Fdiv>\n\n  <!-- project list -->\n  <div style=\"max-width:1100px;margin:0 auto;padding:0 28px 80px;width:100%\">\n    <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <div style=\"{{ p.rowStyle }}\" sc-camel-on-click=\"{{ p.onClick }}\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;padding:20px 0 0\">\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#aaa;width:28px;flex:none\">{{ p.num }}<\u002Fspan>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <span style=\"{{ p.titleStyle }}\">{{ p.title }}<\u002Fspan>\n              <span style=\"{{ p.toggleStyle }}\">{{ p.toggle }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap\">\n              <span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#555\">{{ p.meta }}<\u002Fspan>\n              <!-- tags -->\n              <sc-for list=\"{{ p.tagPills }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                <span style=\"{{ tg.style }}\">{{ tg.label }}<\u002Fspan>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ p.toolPills }}\" as=\"tp\" hint-placeholder-count=\"2\">\n                <span style=\"{{ tp.style }}\">{{ tp.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- expanded detail -->\n        <div style=\"{{ p.detailStyle }}\">\n          <sc-if value=\"{{ p.hasCover }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 28px 0 46px;margin:0 -28px\">\n              <div style=\"{{ p.coverStyle }}\" sc-camel-on-click=\"{{ p.coverClick }}\"><\u002Fdiv>\n              <sc-if value=\"{{ p.hasMultipleThumbs }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:8px;margin-top:10px;max-width:420px\">\n                  <sc-for list=\"{{ p.thumbs }}\" as=\"th\" hint-placeholder-count=\"3\">\n                    <div style=\"{{ th.style }}\" sc-camel-on-click=\"{{ th.onClick }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.imagesNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-family:ui-monospace,monospace;font-size:10px;color:#666;margin-top:10px;max-width:420px;line-height:1.5\">{{ p.imagesNote }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.hasExtLink }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 28px 0 46px;margin:0 -28px\">\n              <a href=\"{{ p.extLinkUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stopProp }}\" style=\"display:inline-block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#C6FF00;border:1px solid #C6FF00;padding:8px 14px;text-decoration:none\">▸ {{ p.extLinkLabel }} ↗<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 28px 0 46px;margin:0 -28px\">\n              <video controls poster=\"{{ p.videoPoster }}\" src=\"{{ p.videoSrc }}\" sc-camel-on-click=\"{{ stopProp }}\" style=\"width:100%;max-width:420px;background:#000;display:block\"><\u002Fvideo>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"padding:16px 28px 18px 46px;margin:0 -28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n            <button style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#C6FF00;color:#000;font-weight:700;border:none;padding:9px 18px;cursor:pointer\" sc-camel-on-click=\"{{ p.openMap }}\">◇ View project details<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- Email creative previews -->\n          <sc-if value=\"{{ p.hasEmailPreviews }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 28px 22px 46px;margin:0 -28px\">\n              <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#666;margin-bottom:10px\">Live email creative — click to open<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <sc-for list=\"{{ p.emailButtons }}\" as=\"eb\" hint-placeholder-count=\"2\">\n                  <button style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:none;color:#C6FF00;font-weight:700;border:1px solid #C6FF00;padding:9px 16px;cursor:pointer;transition:background .2s,color .2s\" sc-camel-on-click=\"{{ eb.onClick }}\">▸ {{ eb.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- OQ accordion sub-projects -->\n          <sc-if value=\"{{ p.isOQ }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 28px 22px 46px;margin:0 -28px\">\n              <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#666;margin-bottom:10px\">Three flagship assets — click to expand<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;max-width:640px\">\n                <sc-for list=\"{{ p.oqSubs }}\" as=\"sub\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"{{ sub.headStyle }}\" sc-camel-on-click=\"{{ sub.onClick }}\">\n                      <span style=\"font-size:13px;font-weight:600;color:#e8e6e2;letter-spacing:-.005em\">{{ sub.title }}<\u002Fspan>\n                      <span style=\"{{ sub.arrowStyle }}\">▾<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"{{ sub.bodyStyle }}\">\n                      <p style=\"font-size:11px;line-height:1.7;color:#aaa;margin:0 0 8px\"><strong style=\"color:#C6FF00;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase\">Approach — <\u002Fstrong>{{ sub.approach }}<\u002Fp>\n                      <p style=\"font-size:11px;line-height:1.7;color:#aaa;margin:0\"><strong style=\"color:#C6FF00;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase\">Result — <\u002Fstrong>{{ sub.result }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ═══ PROJECT MAP POPUP ═══ -->\n  <sc-if value=\"{{ showMap }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:250;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease\" sc-camel-on-click=\"{{ closeMap }}\">\n      <div style=\"width:min(760px,92vw);max-height:86vh;overflow:auto;background:#0d0d0d;border:1px solid #2a2a2a;padding:32px\" sc-camel-on-click=\"{{ stopProp }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px\">\n          <div>\n            <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin-bottom:6px\">Project details<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.01em;color:#f0ede8;max-width:520px\">{{ mapTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"background:none;border:1px solid #333;color:#fff;font-size:16px;cursor:pointer;width:32px;height:32px;line-height:1\" sc-camel-on-click=\"{{ closeMap }}\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <!-- node graph -->\n        <div style=\"display:flex;align-items:stretch;gap:0;position:relative\">\n          <sc-for list=\"{{ mapNodes }}\" as=\"node\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1;position:relative;display:flex;flex-direction:column;align-items:center\" sc-camel-on-mouse-enter=\"{{ node.onClick }}\">\n              <sc-if value=\"{{ node.hasConnector }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"{{ node.lineStyle }}\"><\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"{{ node.dotStyle }}\"><\u002Fdiv>\n              <div style=\"{{ node.labelStyle }}\">{{ node.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <!-- expanded node text -->\n        <sc-if value=\"{{ mapActiveText }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px;padding-top:20px;border-top:1px solid #222;animation:fadeIn .25s ease\">\n            <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#C6FF00;margin-bottom:8px\">{{ mapActiveLabel }}<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.75;color:#ccc;max-width:600px\">{{ mapActiveText }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top:20px;font-family:ui-monospace,monospace;font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.06em\">click a node to read that stage · click outside to close<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══ SOCIAL ACCOUNTS POPUP ═══ -->\n  <sc-if value=\"{{ showAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:250;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease\" sc-camel-on-click=\"{{ closeAccounts }}\">\n      <div style=\"width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;background:#0d0d0d;border:1px solid #2a2a2a;padding:32px\" sc-camel-on-click=\"{{ stopProp }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px\">\n          <div>\n            <div style=\"font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin-bottom:6px\">Social media management<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.01em;color:#f0ede8\">Accounts managed<\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"background:none;border:1px solid #333;color:#fff;font-size:16px;cursor:pointer;width:32px;height:32px;line-height:1;flex:none\" sc-camel-on-click=\"{{ closeAccounts }}\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"overflow-y:auto;flex:1\">\n          <sc-for list=\"{{ accountRows }}\" as=\"acc\" hint-placeholder-count=\"7\">\n            <div style=\"{{ acc.rowStyle }}\" sc-camel-on-click=\"{{ acc.onClick }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                <div style=\"display:flex;align-items:baseline;gap:8px\">\n                  <span style=\"font-size:17px;font-weight:700;letter-spacing:-.01em;color:#f0ede8\">{{ acc.client }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#555\">{{ acc.via }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace,monospace;font-size:14px;color:#444\">+<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"{{ acc.detailStyle }}\">\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ acc.platformPills }}\" as=\"pl\" hint-placeholder-count=\"3\">\n                    <span style=\"{{ pl.style }}\">{{ pl.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #222;font-family:ui-monospace,monospace;font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.06em;flex:none\">click an account for platforms · scroll for more<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- lightbox -->\n  <sc-if value=\"{{ showLightbox }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:fadeIn .2s ease\" sc-camel-on-click=\"{{ closeLightbox }}\">\n      <div style=\"width:72px;height:40px;position:absolute;top:20px;right:20px;display:flex;align-items:center;justify-content:flex-end\">\n        <button style=\"background:none;border:1px solid #333;color:#fff;font-size:18px;cursor:pointer;width:36px;height:36px;line-height:1;transition:border-color .2s\" sc-camel-on-click=\"{{ closeLightbox }}\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"width:min(780px,90vw);aspect-ratio:16/9;background:#111 url('{{ lightboxImg }}') center/contain no-repeat;border:1px solid #2a2a2a;position:relative;display:flex;align-items:center;justify-content:center\" sc-camel-on-click=\"{{ stopProp }}\">\n        <sc-if value=\"{{ hasMultipleImages }}\" hint-placeholder-val=\"{{ false }}\">\n          <button style=\"position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:1px solid #333;color:#fff;font-size:20px;cursor:pointer;width:40px;height:40px;line-height:1;transition:border-color .2s\" sc-camel-on-click=\"{{ prevImg }}\">‹<\u002Fbutton>\n          <button style=\"position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:1px solid #333;color:#fff;font-size:20px;cursor:pointer;width:40px;height:40px;line-height:1;transition:border-color .2s\" sc-camel-on-click=\"{{ nextImg }}\">›<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"width:min(780px,90vw);display:flex;justify-content:space-between;align-items:flex-start\" sc-camel-on-click=\"{{ stopProp }}\">\n        <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#aaa;max-width:520px;line-height:1.6\">{{ lightboxLabel }}<\u002Fspan>\n        <span style=\"font-family:ui-monospace,monospace;font-size:9px;text-transform:uppercase;color:#555;white-space:nowrap\">click outside to close<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- email creative preview modal -->\n  <sc-if value=\"{{ showEmailModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:260;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease\" sc-camel-on-click=\"{{ closeEmailModal }}\">\n      <div style=\"width:min(760px,94vw);height:min(860px,88vh);display:flex;flex-direction:column;background:#0d0d0d;border:1px solid #2a2a2a;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:popIn .45s cubic-bezier(.16,1,.3,1)\" sc-camel-on-click=\"{{ stopProp }}\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a2a2a;background:#111;flex:none\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#333;display:inline-block\"><\u002Fspan>\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#333;display:inline-block\"><\u002Fspan>\n            <span style=\"width:8px;height:8px;border-radius:50%;background:#C6FF00;display:inline-block\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-left:10px\">{{ emailModalLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <button style=\"background:none;border:1px solid #333;color:#fff;font-size:14px;cursor:pointer;width:28px;height:28px;line-height:1;transition:border-color .2s\" sc-camel-on-click=\"{{ closeEmailModal }}\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <iframe src=\"{{ emailModalUrl }}\" style=\"flex:1;border:none;width:100%;background:#fff\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- footer -->\n  <div style=\"border-top:1px solid #1e1e1e;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#444;background:#0a0a0a\">\n    <span style=\"font-weight:700;color:#fff\">Essia Zarrouk<\u002Fspan>\n    <a href=\"index.html#contact\" style=\"color:#C6FF00;text-decoration:none\">Let's chat ↗<\u002Fa>\n    <span>©2026<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { activeTag: \"All\", activeTools: [], open: -1, lightbox: null, mapOpenIdx: -1, mapNodeIdx: 0, showAccounts: false, accountIdx: -1, oqSubOpen: -1, emailModal: null };\n\n  openEmailPreview(label, url){\n    this.setState({ emailModal: { label, url } });\n  }\n\n  toolNames = [\"GA4\",\"Google Tag Manager\",\"Google Ads\",\"Algolia\",\"SEMrush\",\n    \"ActiveCampaign\",\"HubSpot\",\"MS Dynamics\",\"Adobe Suite\",\"Figma\",\"Premiere Pro\",\n    \"CapCut\",\"After Effects\",\"Logic Pro\",\"WordPress\",\"ClickUp\",\"Microsoft Planner\",\n    \"Excel\",\"PowerPoint\",\"Buffer\",\"LinkedIn\",\"Instagram\",\"TikTok\",\"Pinterest\",\n    \"Claude Design\",\"Claude Code\",\"Claude API\",\"GitHub\",\"Electron/Tauri\",\"Hand Production\"];\n\n  componentDidMount() {\n    const param = new URLSearchParams(window.location.search).get('skill');\n    if (param) this.setState({ activeTag: decodeURIComponent(param) });\n  }\n\n  skillNames = [\"Brand Strategy\",\"Social Media\",\"Content & Copy\",\"Art Direction\",\n    \"Account Management\",\"Analytics & Performance\",\"Brand & Communications\",\n    \"Media Production\",\"Product Management\",\"Research & Insight\",\n    \"Team Management\",\"Email Marketing\"];\n\n  pad(n){ return (n < 10 ? \"0\" : \"\") + n; }\n\n  parseSections(desc){\n    if(!desc) return [];\n    const labels = ['Challenge','Approach','Framework','Result'];\n    const sections = [];\n    for(let i=0;i<labels.length;i++){\n      const lbl=labels[i], next=labels[i+1];\n      const re=new RegExp(lbl+'\\\\.\\\\s+([\\\\s\\\\S]+?)(?='+(next?next+'\\\\.':'$')+')');\n      const m=desc.match(re);\n      if(m) sections.push({label:lbl, text:m[1].trim()});\n    }\n    return sections.length ? sections : [{label:'Overview', text:desc}];\n  }\n\n  // Build deduplicated flat project list from ESSIA.projects\n  buildFlat(){\n    const E = window.ESSIA||{};\n    const buckets = E.projects||{};\n    const seen = new Set();\n    const flat = [];\n    const skillMap = {\n      \"01\":\"Brand Strategy\",\"02\":\"Social Media\",\"03\":\"Content & Copy\",\n      \"04\":\"Art Direction\",\"05\":\"Account Management\",\"06\":\"Analytics & Performance\",\n      \"07\":\"Brand & Communications\",\"08\":\"Media Production\",\"09\":\"Product Management\",\n      \"10\":\"Research & Insight\",\"11\":\"Team Management\",\"12\":\"Email Marketing\"\n    };\n    Object.entries(buckets).forEach(([num, projs])=>{\n      (projs||[]).forEach(p=>{\n        const key = p.title.slice(0,60);\n        if(seen.has(key)){\n          // merge tag onto existing\n          const ex = flat.find(f=>f.title.slice(0,60)===key);\n          if(ex && !ex.tags.includes(skillMap[num])) ex.tags.push(skillMap[num]);\n          return;\n        }\n        seen.add(key);\n        // read tags from projectsFlat if available, else default to skill\n        flat.push({\n          title: p.title, client: p.client, year: p.year, desc: p.desc||'',\n          tags: (p.tags && p.tags.length) ? p.tags : [skillMap[num]],\n          tools: p.tools || [], coverImg: p.coverImg || '',\n          images: (p.images && p.images.length) ? p.images : (p.coverImg ? [p.coverImg] : []),\n          imagesNote: p.imagesNote || '',\n          extLinkUrl: p.extLink ? p.extLink.url : '',\n          extLinkLabel: p.extLink ? p.extLink.label : '',\n          videoSrc: p.video ? p.video.src : '',\n          videoPoster: p.video ? p.video.poster : '',\n          emailPreviews: p.emailPreviews || []\n        });\n      });\n    });\n    // OQ parent project (accordion sub-projects) — inject once\n    if(E.oqProject && !seen.has(E.oqProject.title.slice(0,60))){\n      seen.add(E.oqProject.title.slice(0,60));\n      flat.push({\n        title: E.oqProject.title, client: E.oqProject.client, year: E.oqProject.year,\n        desc: E.oqProject.desc||'', tags: E.oqProject.tags||[], tools: E.oqProject.tools||[],\n        subProjects: E.oqProject.subProjects||[]\n      });\n    }\n    return flat;\n  }\n\n  renderVals(){\n    const { activeTag, open, lightbox } = this.state;\n    const E = window.ESSIA||{};\n    const intro = \"Each skill below is a filter. A project can carry multiple skills — click any tag to see all projects where that skill shows up.\";\n\n    const all = this.buildFlat();\n\n    // Tag chips: All + each skill that has ≥1 project\n    const tagCounts = {};\n    all.forEach(p=>(p.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; }));\n    const base = \"font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;cursor:pointer;border:none;transition:background .18s,color .18s;\";\n    const tagChips = [\n      { label:\"All\", count:all.length, style: activeTag===\"All\" ? base+\"background:#C6FF00;color:#000;font-weight:700\" : base+\"background:transparent;color:#ddd;border:1px solid #383838\", onClick:()=>this.setState({activeTag:\"All\",open:-1}) },\n      ...this.skillNames.filter(n=>tagCounts[n]).map(n=>({\n        label: n, count: tagCounts[n]||0,\n        style: activeTag===n ? base+\"background:#C6FF00;color:#000;font-weight:700\" : base+\"background:transparent;color:#888;border:1px solid #333\",\n        onClick:()=>this.setState({activeTag:n,open:-1})\n      })),\n      { label:\"Social Media Management\", count:(E.socialAccounts||[]).length,\n        style: base+\"background:transparent;color:#888;border:1px solid #C6FF00\",\n        onClick:()=>this.setState({showAccounts:true, accountIdx:-1}) }\n    ];\n\n    // Tool chips\n    const { activeTools } = this.state;\n    const toolCounts = {};\n    all.forEach(p=>(p.tools||[]).forEach(t=>{ toolCounts[t]=(toolCounts[t]||0)+1; }));\n    const tBase = \"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 13px;cursor:pointer;border:none;transition:background .18s,color .18s;margin:2px;\";\n    const toolChips = [\n      { label:\"All tools\", isActive: activeTools.length===0,\n        style: activeTools.length===0 ? tBase+\"background:#C6FF00;color:#000;font-weight:700\" : tBase+\"background:transparent;color:#ccc;border:1px solid #333\",\n        onClick:()=>this.setState({activeTools:[],open:-1}) },\n      ...this.toolNames.filter(n=>toolCounts[n]).map(n=>({\n        label:n, count:toolCounts[n]||0, isActive: activeTools.includes(n),\n        style: activeTools.includes(n) ? tBase+\"background:#C6FF00;color:#000;font-weight:700;border:1px solid #C6FF00\" : tBase+\"background:transparent;color:#ccc;border:1px solid #333\",\n        onClick:()=>{ const t=this.state.activeTools; this.setState({activeTools: t.includes(n)?t.filter(x=>x!==n):[...t,n], open:-1}); }\n      }))\n    ];\n\n    const skillFiltered = activeTag===\"All\" ? all : all.filter(p=>(p.tags||[]).includes(activeTag));\n    const filtered = activeTools.length===0 ? skillFiltered : skillFiltered.filter(p=> activeTools.some(t=>(p.tools||[]).includes(t)));\n    const hasResults = filtered.length > 0;\n    const clearAll = ()=>this.setState({activeTag:\"All\",activeTools:[],open:-1});\n\n    const projects = filtered.map((proj,i)=>{\n      const isOpen = i===open;\n      const images = [0,1,2,3].map(j=>({ num:j+1, onClick:(e)=>{ e.stopPropagation(); this.setState({lightbox:{title:proj.title,img:j}}); } }));\n      const tagPills = (proj.tags||[]).map(t=>({\n        label:t,\n        style: t===activeTag && activeTag!==\"All\"\n          ? \"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:#C6FF00;color:#000;padding:3px 9px;font-weight:700\"\n          : \"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #3a3a3a;color:#ddd;padding:3px 9px\"\n      }));\n      return {\n        num: this.pad(i+1),\n        title: proj.title,\n        meta: \"( \"+proj.client+\" ) · ( \"+proj.year+\" )\",\n        toggle: isOpen?\"−\":\"+\",\n        tagPills,\n        rowStyle: \"border-top:1px solid #1e1e1e\",\n        titleStyle: isOpen\n          ? \"font-size:clamp(18px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;color:#fff\"\n          : \"font-size:clamp(18px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;color:#888;transition:color .2s\",\n        toggleStyle: isOpen\n          ? \"font-size:22px;color:#C6FF00;line-height:1;cursor:pointer\"\n          : \"font-size:22px;color:#333;line-height:1;cursor:pointer\",\n        detailStyle: isOpen ? \"display:block;animation:slideUp .35s ease\" : \"display:none\",\n        sections: this.parseSections(proj.desc),\n        images,\n        onClick:()=>this.setState({open:isOpen?-1:i, lightbox:null})\n      };\n    });\n\n    const showLightbox = !!lightbox;\n    const lightboxImages = lightbox ? (lightbox.images||[]) : [];\n    const lightboxImg = lightbox ? lightboxImages[lightbox.img] : \"\";\n    const lightboxLabel = lightbox ? lightbox.title+\" · Image \"+(lightbox.img+1)+\" of \"+lightboxImages.length : \"\";\n    const hasMultipleImages = lightboxImages.length > 1;\n    const closeLightbox = ()=>this.setState({lightbox:null});\n    const prevImg = (e)=>{ e.stopPropagation(); this.setState({lightbox:{...lightbox, img:(lightbox.img-1+lightboxImages.length)%lightboxImages.length}}); };\n    const nextImg = (e)=>{ e.stopPropagation(); this.setState({lightbox:{...lightbox, img:(lightbox.img+1)%lightboxImages.length}}); };\n    const stopProp = e=>e.stopPropagation();\n\n    const toolPillsFor = (proj) => (proj.tools||[]).map(t=>({\n      label:t,\n      style:`font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid #3a3a3a;color:#aaa;padding:3px 9px;${activeTools.includes(t)?'border-color:#C6FF00;color:#C6FF00':''}`\n    }));\n\n    const projectsFull = filtered.map((proj,i)=>{\n      const isOpen = i===this.state.open;\n      const projImages = proj.images && proj.images.length ? proj.images : (proj.coverImg ? [proj.coverImg] : []);\n      const hasMultipleThumbs = projImages.length > 1;\n      const thumbs = projImages.map((src,j)=>({\n        src, num:j+1,\n        style: `width:64px;height:64px;background:#111 url('${src}') center/cover no-repeat;border:1px solid #2a2a2a;cursor:pointer;flex:none`,\n        onClick:(e)=>{ e.stopPropagation(); this.setState({lightbox:{title:proj.title,images:projImages,img:j}}); }\n      }));\n      const tagPills = (proj.tags||[]).map(t=>({\n        label:t,\n        style: t===activeTag && activeTag!==\"All\"\n          ? \"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:#C6FF00;color:#000;padding:3px 9px;font-weight:700\"\n          : \"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #3a3a3a;color:#ddd;padding:3px 9px\"\n      }));\n      const { oqSubOpen } = this.state;\n      const isOQ = !!proj.subProjects;\n      const oqSubs = isOQ ? proj.subProjects.map((sp,si)=>{\n        const subOpen = isOpen && si===oqSubOpen;\n        return {\n          title: sp.title, approach: sp.approach, result: sp.result,\n          headStyle: \"display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:#111;border:1px solid #222;border-radius:2px\",\n          arrowStyle: subOpen ? \"font-size:14px;color:#C6FF00;transition:transform .3s ease;transform:rotate(180deg)\" : \"font-size:14px;color:#555;transition:transform .3s ease\",\n          bodyStyle: subOpen ? \"max-height:300px;opacity:1;padding:14px 16px 16px;transition:max-height .45s cubic-bezier(.16,1,.3,1),opacity .35s ease,padding .3s ease\" : \"max-height:0;opacity:0;padding:0 16px;overflow:hidden;transition:max-height .35s ease,opacity .2s ease,padding .3s ease\",\n          onClick: (e)=>{ e.stopPropagation(); this.setState({oqSubOpen: subOpen?-1:si}); }\n        };\n      }) : [];\n      const coverImg = projImages[0] || '';\n      const hasCover = !!coverImg;\n      const coverStyle = isOpen\n        ? `width:100%;max-width:420px;aspect-ratio:16/10;background:#111 url('${coverImg}') center/cover no-repeat;border:1px solid #2a2a2a;opacity:1;transform:scale(1) translateY(0);transition:opacity .6s cubic-bezier(.16,1,.3,1) .1s,transform .6s cubic-bezier(.16,1,.3,1) .1s;margin-bottom:18px;cursor:pointer`\n        : `width:100%;max-width:420px;aspect-ratio:16/10;background:#111 url('${coverImg}') center/cover no-repeat;border:1px solid #2a2a2a;opacity:0;transform:scale(.92) translateY(14px);transition:opacity .25s ease,transform .25s ease;margin-bottom:18px;cursor:pointer`;\n      const hasEmailPreviews = !!(proj.emailPreviews && proj.emailPreviews.length);\n      const emailButtons = (proj.emailPreviews||[]).map((ep)=>({\n        label: ep.label,\n        onClick:(e)=>{ e.stopPropagation(); this.openEmailPreview(ep.label, ep.pdf); }\n      }));\n      return { ...projects[i]||{}, toolPills: toolPillsFor(proj), tagPills, thumbs, hasMultipleThumbs,\n        num: String(i+1).padStart(2,'0'), title:proj.title, meta:`( ${proj.client||'—'} ) · ( ${proj.year||'—'} )`,\n        sections: this.parseSections(proj.desc),\n        hasCover, coverStyle,\n        isOQ, oqSubs,\n        hasEmailPreviews, emailButtons,\n        imagesNote: proj.imagesNote || '',\n        hasExtLink: !!proj.extLinkUrl, extLinkUrl: proj.extLinkUrl, extLinkLabel: proj.extLinkLabel,\n        hasVideo: !!proj.videoSrc, videoSrc: proj.videoSrc, videoPoster: proj.videoPoster,\n        detailStyle: isOpen ? \"display:block;max-height:2000px;opacity:1;transition:max-height .6s cubic-bezier(.16,1,.3,1),opacity .5s ease\" : \"display:block;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s cubic-bezier(.7,0,.84,0),opacity .3s ease\",\n        toggleStyle: isOpen ? \"font-size:22px;color:#C6FF00;line-height:1\" : \"font-size:22px;color:#333;line-height:1\",\n        onClick:()=>this.setState({open:i, lightbox:null}),\n        coverClick:(e)=>{ e.stopPropagation(); this.setState({lightbox:{title:proj.title,images:projImages,img:0}}); },\n        openMap:(e)=>{ e.stopPropagation(); this.setState({mapOpenIdx:i, mapNodeIdx:0}); }\n      };\n    });\n\n    // ── Project map popup ──\n    const { mapOpenIdx, mapNodeIdx } = this.state;\n    const showMap = mapOpenIdx >= 0 && !!filtered[mapOpenIdx];\n    const mapProj = showMap ? filtered[mapOpenIdx] : null;\n    const mapTitle = mapProj ? mapProj.title : \"\";\n    const mapSections = mapProj ? this.parseSections(mapProj.desc) : [];\n    const mapNodes = mapSections.map((sec,i)=>{\n      const isActive = i===mapNodeIdx;\n      const isPast = i<mapNodeIdx;\n      return {\n        label: sec.label,\n        hasConnector: i>0,\n        lineStyle: `position:absolute;top:15px;left:-50%;width:100%;height:2px;background:${isPast||isActive?'#C6FF00':'#333'};z-index:0;transition:background .6s cubic-bezier(.16,1,.3,1)`,\n        dotStyle: `width:15px;height:15px;border-radius:50%;cursor:pointer;z-index:1;border:2px solid ${isActive?'#C6FF00':'#3a3a3a'};background:${isActive?'#C6FF00':'#0d0d0d'};transform:scale(${isActive?'1.3':'1'});transition:all .5s cubic-bezier(.34,1.56,.64,1)`,\n        labelStyle: `margin-top:10px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:${isActive?'#fff':'#666'};font-weight:${isActive?'700':'400'};transition:color .4s ease;text-align:center`,\n        onClick: ()=>this.setState({mapNodeIdx:i})\n      };\n    });\n    const mapActive = mapSections[mapNodeIdx];\n    const mapActiveText = mapActive ? mapActive.text : \"\";\n    const mapActiveLabel = mapActive ? mapActive.label : \"\";\n    const closeMap = ()=>this.setState({mapOpenIdx:-1});\n\n    // ── Social accounts popup ──\n    const { showAccounts, accountIdx } = this.state;\n    const accountRows = (E.socialAccounts||[]).map((acc,i)=>{\n      const isOpen = i===accountIdx;\n      return {\n        client: acc.client, via: acc.via,\n        rowStyle: `border-top:1px solid #1e1e1e;padding:16px 4px;cursor:pointer;transition:background .2s ease`,\n        onClick: ()=>this.setState({accountIdx: isOpen?-1:i}),\n        platformPills: (acc.platforms||[]).map(pl=>({\n          label:pl,\n          style:\"font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #3a3a3a;color:#ccc;padding:3px 9px;transition:all .3s ease\"+(isOpen?\";border-color:#C6FF00;color:#C6FF00\":\"\")\n        })),\n        detailStyle: isOpen ? \"max-height:60px;opacity:1;margin-top:10px;transition:max-height .4s cubic-bezier(.16,1,.3,1),opacity .3s ease\" : \"max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .2s ease\"\n      };\n    });\n    const closeAccounts = ()=>this.setState({showAccounts:false});\n\n    // ── Email preview modal ──\n    const { emailModal } = this.state;\n    const showEmailModal = !!emailModal;\n    const emailModalLabel = emailModal ? emailModal.label : \"\";\n    const emailModalUrl = emailModal ? emailModal.url : \"\";\n    const closeEmailModal = ()=>this.setState({emailModal:null});\n\n    return { intro, tagChips, toolChips, activeTag, projectCount: filtered.length, projects: projectsFull,\n             hasResults, clearAll, showLightbox, lightboxLabel, lightboxImg, hasMultipleImages, prevImg, nextImg, closeLightbox, stopProp,\n             showMap, mapTitle, mapNodes, mapActiveText, mapActiveLabel, closeMap,\n             showAccounts, accountRows, closeAccounts,\n             showEmailModal, emailModalLabel, emailModalUrl, closeEmailModal };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
