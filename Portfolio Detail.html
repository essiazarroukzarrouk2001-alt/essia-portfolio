document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"82f7a0ae-10be-48e1-b7e2-7f59e626b305\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<script>\n/**\n * ─────────────────────────────────────────────\n *  ESSIA ZARROUK — SITE CONTENT\n *  Edit values below. Save → reload page.\n * ─────────────────────────────────────────────\n */\nwindow.ESSIA = {\n\n  // ── GLOBAL ──────────────────────────────────────────────\n  name:     \"Essia Zarrouk\",\n  role:     \"Marketing & Branding Specialist\",\n  tagline:  \"Between the big idea and the bottom line — that's where I work.\",\n  tagline2: \"A film lover's eye for story, a puzzler's instinct for making the pieces fit.\",\n  signoff:  \"Not new here, but always improving.\",\n\n  // ── PROFILE ─────────────────────────────────────────────\n  bio: \"I own the whole arc — strategy, creative, and delivery. Across three years in agencies and brands, I've led product launches from concept to market, creative-directed shoots and films, managed global clients like Mitsubishi, and owned the budgets, timelines, and teams that keep it all moving. Agency-trained, I now run brand and marketing end to end for a design and architecture studio in Amsterdam. My edge is range: I can set the direction and ship the work, read the analytics and brief the creative. Trilingual (Arabic, French, English), and at my best with a lot in motion and a problem to solve.\",\n\n  // ── CONTACT ─────────────────────────────────────────────\n  email:     \"essiazarrouk.zarrouk2001@gmail.com\",\n  phone:     \"+31 6 43 60 7222\",\n  instagram: \"@essiazarrouk\",\n  linkedin:  \"/in/essia-zarrouk\",\n  location:  \"Amsterdam\",\n\n  // ── SKILLS ──────────────────────────────────────────────\n  skills: [\n    { num:\"01\", name:\"Brand Strategy\", intro:\"Projects that shaped how I think about brand strategy — category creation, mental availability, and building brands that stick.\" },\n    { num:\"02\", name:\"Social Media\", intro:\"▢ your intro for this skill\" },\n    { num:\"03\", name:\"Content & Copy\", intro:\"Content strategy and copywriting — building content engines, editorial calendars, and copy that converts.\" },\n    { num:\"04\", name:\"Art Direction\", intro:\"Art direction — campaign concepting, visual systems, and directing shoots and productions from brief to delivery.\" },\n    { num:\"05\", name:\"Account Management\", intro:\"Managing global B2B client portfolios, agency relationships, and integrated campaign delivery end to end.\" },\n    { num:\"06\", name:\"Analytics & Performance\", intro:\"Building the measurement infrastructure behind campaigns — first-party data, privacy-compliant tracking, and behavioural instrumentation that makes every downstream decision more accurate.\" },\n    { num:\"07\", name:\"Brand & Communications\", intro:\"Brand and communications work — from company rebrands to messaging houses and brand voice systems.\" },\n    { num:\"08\", name:\"Media Production\", intro:\"Video and media production — scripting, directing, and producing content across formats and audiences.\" },\n    { num:\"09\", name:\"Product Management\", intro:\"Product management — owning launches end to end, from brief and positioning through to production and go-to-market.\" },\n    { num:\"10\", name:\"Research & Insight\", intro:\"Analytics, MarTech, and research — turning data into strategy and building the measurement infrastructure behind campaigns.\" },\n    { num:\"11\", name:\"Team Management\", intro:\"Leading and managing creative, development, and agency teams — from briefing and feedback to culture and performance.\" },\n    { num:\"12\", name:\"Email Marketing\", intro:\"End-to-end email marketing — from programme setup and automation to segmentation, testing, and reporting.\" },\n    { num:\"13\", name:\"Social Media Management\", intro:\"Accounts I've run day-to-day — content, community, and growth across platforms.\" }\n  ],\n\n  // ── OQ PARENT PROJECT (accordion sub-projects) ──────────\n  oqProject: {\n    title: \"EMG \\u00b7 OQ \\u2014 Messaging for Flagship Industrial Projects\",\n    client: \"OQ (via EMG)\", year: \"2024\",\n    tags: [\"Brand & Communications\",\"Brand Strategy\",\"Account Management\"],\n    tools: [\"PowerPoint\",\"Word\",\"Adobe Suite\"],\n    desc: `Challenge. OQ needed clear, compelling messaging for three of its most significant industrial projects \\u2014 the OQ Polymer Complex (formerly Liwa Plastics), the Duqm Refinery, and the LPG and ammonia plants in Salalah. These are technically complex, multi-billion-dollar assets, and the challenge was to translate heavy industrial and petrochemical detail into a narrative that was clear, credible, and aligned to OQ's larger story of national growth and energy transition \\u2014 for industry stakeholders, partners, and international markets.\n\nFramework. Technical-to-strategic message translation + message architecture. Industrial B2B communications work when complex detail is distilled into a clear value story, and every project ladders back to one overarching brand narrative. The skill is translation \\u2014 turning engineering into meaning \\u2014 while keeping the whole portfolio of messages aligned to the company's strategic goals.\n\nResult. Contributed to clear, consistent, on-brand messaging across three of OQ's flagship industrial projects \\u2014 helping turn complex technical assets into a coherent story aligned to OQ's national growth and transition narrative.`,\n    subProjects: [\n      {\n        title: \"OQ Polymer Complex (formerly Liwa Plastics)\",\n        approach: \"Contributed to translating the polymer story into product/capability messaging; positioned it as Oman's arrival in global polymers; connected it to Vision 2040 diversification.\",\n        result: \"Helped position OQ's flagship polymer complex as a milestone for Oman's downstream industry.\"\n      },\n      {\n        title: \"OQ Duqm Refinery\",\n        approach: \"Helped distil refining-scale complexity into clear messaging; framed Duqm within OQ's value-chain and national-infrastructure story.\",\n        result: \"Contributed to consistent messaging conveying Duqm's role in OQ's integrated value chain.\"\n      },\n      {\n        title: \"OQ Salalah LPG & Ammonia Plants\",\n        approach: \"Helped translate LPG/ammonia production into value messaging (feedstock for fertilisers, resins, downstream industries); tied it to OQ's growth story.\",\n        result: \"Contributed to messaging that made specialised chemical outputs meaningful to industry and investment audiences.\"\n      }\n    ]\n  },\n\n  // ── SOCIAL ACCOUNTS MANAGED ─────────────────────────────\n  socialAccounts: [\n    { client:\"Chatlicense\",  via:\"\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"Joolz\",        via:\"via EMG\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"OQ\",           via:\"via EMG\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"Songwon\",      via:\"via EMG\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"Westfalia\",    via:\"via EMG\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"ClearCorrect\", via:\"via EMG\", platforms:[\"Instagram\",\"LinkedIn\",\"TikTok\"] },\n    { client:\"NOWN\",         via:\"\", platforms:[\"Instagram\",\"LinkedIn\",\"Pinterest\"] }\n  ],\n\n  // ── PROJECTS ────────────────────────────────────────────\n  projects: {\n    \"02\": [\n      {\n        title:  \"NOWN ASOFT — Launching a new colourway through a staged, omnichannel funnel\",\n        client: \"NOWN / ASOFT\",\n        year:   \"2025–2026\",\n        tags:   [\"Social Media\",\"Email Marketing\",\"Content & Copy\",\"Art Direction\"],\n        tools:  [\"ActiveCampaign\",\"Adobe Suite\",\"LinkedIn\",\"Instagram\",\"Pinterest\",\"WordPress\"],\n        role:   \"Social Media\",\n        images: [\"asoftfeltcolorway.jpeg\",\"Ube-photoshop-copy-768x768.jpg\"],\n        video: { src: \"A73C5759-99E5-4979-9ED5-1DFD0C3AE7AF.MP4\", poster: \"\" },\n        desc:   `Challenge. ASOFT's PET-felt line had a new seasonal colour range. A line extension doesn't need explaining — it needs desire and a reason to act. The goal: turn new colours into measurable demand — quote requests, traffic, audience growth.\n\nApproach. Built the campaign as a sequenced funnel on the AIDA model (Attention → Interest → Desire → Action), where art direction drives the top and a recurring conversion goal — quote requests — closes it. Rather than one launch moment, I designed a content cadence: colour moodboards to spark desire, then quote-request pushes, then proof (assembly tricks, the CADENZA case study), looping back to conversion — so the campaign compounds instead of spiking once.\n\nFramework. AIDA funnel + content cadence across LinkedIn, Instagram, Pinterest, web blog, and e-mail newsletter. Paid + organic layer for the seasonal push, plus an in-person assembly event.\n\nResult. +15% quote requests (the campaign's core conversion goal), ~10% lift in website traffic, +8% LinkedIn and +5% Instagram audience growth. Owned solo, from production analysis through to reporting.`\n      },\n      {\n        title:  \"Algolia Behavioural-Data Instrumentation — NOWN\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Analytics & Performance\"],\n        tools:  [\"Algolia\",\"GA4\"],\n        role:   \"Analytics & Performance\",\n        desc:   `Challenge. NOWN's Algolia-powered site search wasn't receiving any behavioural data — no clicks, conversions, or engagement events. Without that data, Algolia's relevance features like Dynamic Re-Ranking had nothing to learn from, so search results couldn't improve over time.\n\nApproach. Instrumented Algolia's Events API to capture real user behaviour — click-through, conversion, and engagement signals — feeding them back into the search engine so its relevance model could learn and improve from actual usage patterns.\n\nFramework. Behavioural data instrumentation → closed-loop relevance optimisation. Search quality compounds: the more signal you give the algorithm, the better it ranks, the more it converts, the more signal you get. Getting the instrumentation right is the foundation the whole loop depends on.\n\nResult. Algolia's search now receives live behavioural data, enabling Dynamic Re-Ranking to optimise results based on real user behaviour — turning a static search index into a self-improving relevance engine.`\n      }\n    ],\n\n    \"10\": [\n      \n      \n      {\n        title:  \"Google Ads Campaign Management — Songwon (via EMG)\",\n        client: \"Songwon (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Analytics & Performance\"],\n        tools:  [\"Google Ads\",\"GA4\"],\n        role:   \"Research & Insight\",\n        desc:   `Challenge. Songwon, a global B2B chemicals brand, needed paid search that did more than drive clicks — it had to raise awareness of sustainability initiatives, strengthen corporate branding, and support product promotions, reaching the right professional audience segments efficiently.\n\nApproach. I managed Songwon's Google Ads campaigns end to end: Align to objectives. Structured campaigns around the brand's priorities — sustainability, corporate branding, and product promotions — so spend served real business goals, not just traffic. Optimise for relevance. Tuned ad performance to drive targeted, qualified traffic rather than volume, keeping the right audiences in focus. Extend reach with precision. Enhanced visibility across key audience segments while keeping the campaigns efficient.\n\nFramework. Intent-based targeting + relevance optimisation. Paid search works when spend follows intent — reaching people already signalling a need, then continuously optimising for relevance and quality of traffic over raw clicks. In B2B especially, precision beats volume: fewer, better-qualified visitors are worth more than broad reach.\n\nResult. Targeted paid campaigns that drove qualified traffic and lifted Songwon's visibility across key audience segments, aligned to sustainability, branding, and product goals.`\n      },\n      {\n        title:  \"User Research & Product Testing — ChatLicense\",\n        client: \"ChatLicense\",\n        year: \"2023\",\n        tags:   [\"Research & Insight\",\"Product Management\"],\n        tools:  [\"Excel\"],\n        role:   \"Research & Insight\",\n        images: [\"52e7709b-ffb3-443d-ada9-38694edde8f1.JPEG\",\"3d8ba2f8-35cc-43cf-846a-ea5697707309.JPEG\",\"31389c10-3910-49e7-a6ed-04916bfd3620.JPEG\"],\n        desc:   `Challenge. ChatLicense was a pre-launch app that couldn't afford to guess what its audience wanted. It needed real evidence — from actual users in the target audience — to shape the product before it shipped.\n\nApproach. My approach: Research the market. Conducted market research to understand the landscape the app was launching into. Test with real users. Ran testing sessions across multiple schools in the Netherlands — putting the product in front of its actual target audience. Turn feedback into product change. Gathered and synthesised user feedback into concrete refinements, feeding insight directly back into development.\n\nFramework. User-centred research / the build–measure–learn loop. Products improve when real usage — not assumption — drives decisions. Testing with the genuine target audience and looping that feedback into development is primary user research in practice: insight generated from behaviour, then acted on.\n\nResult. A product refined by real user evidence before launch — decisions grounded in how the target audience actually responded, not internal guesswork.`\n      },\n      {\n        title:  \"Competitive & Market Research — ClearCorrect (via EMG)\",\n        client: \"ClearCorrect (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Research & Insight\",\"Brand Strategy\"],\n        tools:  [\"SEMrush\",\"Excel\"],\n        role:   \"Research & Insight\",\n        images: [\"ICC.1750 (Experience_Aligner).jpg\",\"03.png\",\"png.png\",\"png-3.png\"],\n        desc:   `Challenge. ClearCorrect, a global dental-aligner brand, needed to understand how its competitors were positioning and marketing themselves — and where the opportunities were — to sharpen its own strategy.\n\nApproach. My approach: Deep-dive the competition. Conducted a structured analysis of competitors' digital marketing strategies, campaigns, content, and online presence. Analyse for patterns. Assessed what competitors were doing well and where the gaps sat. Translate into recommendations. Delivered insights and recommendations tailored specifically to ClearCorrect's goals — the actionable so-what, not just the findings.\n\nFramework. Competitive intelligence + gap analysis. Competitive research creates value only when it moves from description to direction — mapping the landscape to find the whitespace a brand can own. Tailoring recommendations to the client's specific goals is what turns a competitor audit into strategy.\n\nResult. A clear read of ClearCorrect's competitive landscape, converted into actionable recommendations that fed directly into the brand's marketing decisions.`\n      },\n      {\n        title:  \"Competitive Research & Strategic Recommendations — Westfalia (via EMG)\",\n        client: \"Westfalia (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Research & Insight\",\"Brand Strategy\"],\n        tools:  [\"SEMrush\",\"Excel\"],\n        role:   \"Research & Insight\",\n        images: [\"04.png\"],\n        desc:   `Challenge. Westfalia needed to understand rival brands' marketing, branding, and outreach to inform its own strategic direction in a competitive market.\n\nApproach. My approach: Map the field. Researched competitors' marketing strategies across the category. Analyse the approach. Examined their campaigns, branding, and outreach efforts to understand what was working and why. Deliver direction. Produced actionable insights and recommendations to shape Westfalia's own strategy.\n\nFramework. Benchmarking + strategic synthesis. Benchmarking against competitors only pays off when findings are synthesised into a point of view — here's what they do, here's what it means for us, here's what we should do. That synthesis step is where research becomes insight.\n\nResult. A competitor analysis that gave Westfalia an evidence-based foundation and clear recommendations for its marketing strategy.`\n      }\n    ],\n\n    \"11\": [\n      {\n        title:  \"NOWN · Managing Creative & Technical Teams\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Team Management\",\"Product Management\",\"Art Direction\"],\n        tools:  [\"ClickUp\",\"Microsoft Planner\",\"Figma\",\"Adobe Suite\"],\n        role:   \"Team Management\",\n        images: [\"IMG_2040.JPEG\",\"IMG_2116.JPEG\",\"IMG_2402.JPEG\"],\n        desc:   `Challenge. Delivering NOWN's products and campaigns meant leading people across very different crafts — film crews, designers and creatives, and a web developer I was the official manager of. Each discipline speaks its own language and needs a different kind of direction, and all of it had to stay aligned to the brand and the commercial goal.\n\nApproach. Directed creative teams and crews, briefing and directing designers and creatives, and directing film crews on shoots — translating objectives into clear creative direction from concept to delivery. As the official line manager of the web developer, owned that relationship day to day — setting priorities, defining what needed building, keeping technical delivery aligned to the product. Kept creative, technical, and production strands moving toward one coherent outcome.\n\nFramework. Cross-disciplinary team leadership + formal line management. The hardest management spans disciplines — directing creatives and developers at once means adapting how you brief, motivate, and measure each. Holding formal management responsibility for a developer while creatively directing crews and designers is leadership across both people-management and craft-direction.\n\nResult. Products and campaigns delivered coherently across creative, film, and development — with direct, formal management responsibility for a developer and hands-on creative direction of teams and crews.`\n      },\n      {\n        title:  \"Leading the Creative Team for Trade Shows — EMG\",\n        client: \"EMG\",\n        year: \"2024\",\n        tags:   [\"Team Management\",\"Account Management\"],\n        tools:  [\"Excel\",\"PowerPoint\"],\n        role:   \"Team Management\",\n        desc:   `Challenge. Major international trade shows (NPE, ACS, Arabplast, GPCA, Fruit Attraction) demanded a high volume of event-tailored content, produced to brand standard, on tight and often simultaneous timelines. A creative team had to be led and kept aligned under real pressure, with no room for slippage before a fixed show date.\n\nApproach. My approach: Direct the output. I led the creative team to develop engaging content tailored to each event, keeping the work anchored to each show's strategy. Hold quality and coherence. I kept the team aligned to brand standards across a demanding, multi-event programme, so output stayed consistent even as volume climbed. Manage against the deadline. I coordinated the team alongside logistics, budget, and timelines, protecting the work while making sure nothing missed an immovable show date.\n\nFramework. Creative team leadership under delivery pressure. Leading creatives well means balancing creative freedom with the discipline of deadlines and brand standards — shielding the work from chaos while keeping it on track. Sustaining that across multiple concurrent events is leadership at operational scale.\n\nResult. Consistent, on-brand creative delivered across multiple global events — a creative team kept aligned, motivated, and productive under genuine deadline pressure, show after show.`\n      },\n      {\n        title:  \"Managing External Partners & Freelancers — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Team Management\"],\n        tools:  [\"ClickUp\",\"Excel\"],\n        role:   \"Team Management\",\n        images: [\"IMG_9543.JPEG\",\"IMG_2028.JPEG\",\"IMG_3280.JPEG\"],\n        desc:   `Challenge. Not every contributor sits in-house. Delivering NOWN's work meant coordinating external developers, production partners, and freelancers — people you lead through influence, clarity, and agreements rather than direct authority, and who can make or break a timeline if they drift.\n\nApproach. My approach: Coordinate delivery. I managed external developers and production partners day to day, keeping their work on track and integrated with the internal team's. Negotiate the terms. I negotiated contracts with freelancers — aligning scope, expectations, deliverables, and cost up front, so everyone was clear before work began. Hold the standard. I kept external contributors working to the same quality bar and timeline as in-house staff, so the seams didn't show in the final work.\n\nFramework. Vendor / stakeholder management — leading without authority. Managing external partners is a distinct leadership skill: you can't simply direct, so you align through clear scope, strong relationships, and negotiation. Getting consistent output from people you don't manage directly is often harder than leading a team you do.\n\nResult. External partners and freelancers integrated smoothly into delivery — coordinated, aligned to standard, and contracted on clear terms, so outside contributors strengthened the work rather than fragmenting it.`\n      }\n    ],\n\n    \"12\": [\n      {\n        title:  \"Monthly Email Marketing Programme — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Email Marketing\",\"Analytics & Performance\"],\n        tools:  [\"ActiveCampaign\",\"Excel\"],\n        role:   \"Email Marketing\",\n        images: [\"nownemailveilprelaunchimg.jpg\",\"nownemailribacpdimg.jpg\",\"nownemailarborisaimg.jpg\",\"nownemailsimplyelevatedimg.jpg\",\"nownemailasoftcolorsimg.jpg\"],\n        imagesNote: \"Note: these are static exports of live emails — GIFs and other motion in the original sends may not be visible here.\",\n        desc:   `Challenge. NOWN needed a consistent, always-on channel to stay in front of its audience, nurture leads, and drive them back to the site and products — owned, direct, and not dependent on algorithms.\n\nApproach. I ran NOWN's email marketing end to end in ActiveCampaign: Build the audience. I built and curated the contact database — growing it to roughly 10,000 contacts and keeping it clean and segmented, so sends reached the right people rather than a bloated list. Run an always-on cadence. I planned, wrote, and shipped monthly campaigns — a reliable rhythm that kept the brand present between bigger pushes. Optimise on performance. I tracked results and refined subject lines, content, and targeting, sustaining a strong average open rate around 40% — well above sector benchmarks.\n\nFramework. Owned-channel / lifecycle email marketing + list hygiene. Email is the highest-control channel — no algorithm between brand and audience — but it performs only on a clean, well-segmented list. Curating the database and maintaining list hygiene is what drives deliverability and engagement; a ~40% open rate is evidence of a genuinely engaged audience, not just volume.\n\nResult. A consistent monthly programme reaching a ~10,000-contact list at an average open rate near 40% — an owned channel that kept NOWN's audience engaged and drove traffic back to the brand.`\n      },\n      {\n        title:  \"Monthly Newsletter — ClearCorrect (via EMG)\",\n        client: \"ClearCorrect (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Email Marketing\",\"Content & Copy\",\"Art Direction\"],\n        tools:  [\"Adobe Suite\",\"HubSpot\"],\n        role:   \"Email Marketing\",\n        desc:   `Challenge. ClearCorrect, a global dental-aligner brand, needed to stay front-of-mind with its audience through a regular newsletter — a format that lives or dies on relevance. Filler gets unsubscribes; genuinely useful curation becomes a habit.\n\nApproach. I owned the newsletter end to end: Research. Tracked industry trends, updates, and news relevant to the audience. Curate. Edited it down to what actually mattered, exercising judgment over volume. Package. Wrote and structured it into a clean, engaging monthly read.\n\nFramework. Curation-as-editorial + the relevance/utility principle. In a crowded inbox, the value isn't volume — it's judgment about what's worth the reader's time. Consistent, genuinely useful curation builds the open-rate habit that turns a newsletter into an owned audience channel.\n\nResult. A reliable, well-read monthly touchpoint that kept ClearCorrect's audience engaged between campaigns — curated tightly enough to read as a genuine industry digest, not brand filler.`\n      }\n    ],\n\n    \"01\": [\n      {\n        title:  \"InfiKnit — NOWN\",\n        coverImg: \"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAUIAuADASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAH89GNIYIYqKEQwAIQwlspDCRhGO2CYzSJbBME12x2NBlIaGmCGgAEMSWAAUAQAUAADpAQCIZIAMABACYAMEmEjBDBACABMENCGAmE0mqGk60zPQAAYCYIaBgAAADQknMxTTKZpAAxiANNsNk2YUgAABMENAAiAoBgAAKmgACAJhypKWZGlY2ak1QNAJFJIoQAMSpCGgVSAA first 3D-knitted ceiling and wall system — a product that merges fashion and architecture. Being first of its kind was its biggest strength and its biggest problem: with no existing category to compare it to, the market couldn't place it. People didn't understand what it was, what it did, or why it mattered.\n\nApproach. I rebuilt the brand around a category-creation strategy, structured on four pillars: Anchor the unfamiliar. I tied a brand-new concept to two things everyone already understands — knit and architecture — so the product had an instant mental foothold instead of asking people to learn something from scratch. Reduce to essential building blocks. I stripped the story to its core, repeatable elements — a ceiling and wall system, made of 3D knit, in four textures and 3,000+ colour combinations — so the message was simple enough to remember and repeat. Consistency as recognition. I held that same language and visual logic across every touchpoint, turning repetition into recall and building the brand's mental availability over time. Turn understanding into experience. Because InfiKnit is a tactile, made-to-spec product, comprehension alone wasn't enough — people had to feel it. I designed a summer campaign around a curated set of seasonal colour combinations, using a free-sample offer as the hook: request samples, and in doing so learn what InfiKnit actually is. The giveaway turned passive curiosity into a physical introduction to the brand — and a qualified lead.\n\nFramework. Category creation + mental availability, activated through experiential sampling. When a product is genuinely first, the job isn't differentiating within a category — it's creating and teaching one. Simplification and consistency build the recall that lets a new category take root; the sampling campaign then converts that awareness into tactile experience, which for a material product is where real belief (and demand) is formed.\n\nResult. A first-of-its-kind product translated into one clear, ownable idea — the first 3D-knitted ceiling and wall system, where fashion meets architecture — made instantly understandable, and brought to life through a seasonal sampling campaign that turned curiosity into hands-on engagement and leads.`\n      },\n      {\n        title:  \"Energy Beyond Limits — OQ (via EMG)\",\n        client: \"OQ (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Brand Strategy\",\"Brand & Communications\"],\n        tools:  [\"PowerPoint\",\"Adobe Suite\"],\n        role:   \"Brand Strategy\",\n        images: [\"thisisoq_cover.jpeg\",\"15.png\",\"Screenshot 2026-08-05 at 10.52.20.png\"],\n        desc:   `Challenge. OQ, Oman's global integrated energy company, needed a distinctive, elevated presence at the GCC's largest energy trade shows (Arabplast, GPCA) — one that stood out against a field of generic corporate-energy messaging and carried Oman's identity onto a global stage.\n\nApproach. I developed OQ's positioning and message architecture around three pillars: National identity as differentiator. In a category where every player says “energy” and “sustainability,” I made Oman itself the ownable difference — drawing on the nation's character, ambition, and heritage so OQ read as Oman's energy company, not another interchangeable multinational. A unifying narrative. I built the “Energy Beyond Limits” platform as the through-line — a single storyline and set of key visuals carried across booths, collateral, and conversations, so the brand told one coherent story rather than scattered messages. Globally legible, locally rooted. I balanced cultural specificity with international readability — translating Omani identity into a premium visual and verbal language a global industry audience could immediately understand and respect.\n\nFramework. Place branding / competitive identity (Anholt). Nations and their flagship brands compete on reputation and projected identity; OQ acts as an ambassador of Oman's competitive identity in energy. The positioning encoded that national character into a premium, globally-legible brand story — turning “where it's from” into the reason it stands out.\n\nResult. A coherent, culturally-rooted brand narrative that gave OQ an ownable, elevated presence at the GCC's most important energy events.`\n      },\n      {\n        title:  \"EcoVadis Platinum Positioning — Songwon (via EMG)\",\n        client: \"Songwon (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Brand Strategy\",\"Brand & Communications\"],\n        tools:  [\"LinkedIn\",\"PowerPoint\"],\n        role:   \"Brand Strategy\",\n        desc:   `Challenge. Songwon earned EcoVadis' Platinum rating — a top-1% sustainability credential — but a ranking alone doesn't shift how a brand is perceived. It needed to be turned from a certificate into a positioning story that actually moved reputation.\n\nApproach. I built the sustainability positioning around three pillars: Let the credential carry the claim. Rather than making broad sustainability statements, I anchored the entire narrative to the EcoVadis Platinum rating — a specific, independently-awarded proof point — so the message was credible by default and immune to greenwashing pushback. Align message to values. I made sure every communication laddered back to Songwon's genuine sustainability goals and corporate values, keeping the positioning consistent and authentic rather than opportunistic. Amplify through earned channels. I extended reach beyond owned posts — coordinating an awareness campaign with press releases and interviews — so the story gained third-party validation and travelled further than a single announcement could.\n\nFramework. Third-party credibility / source validation. Using an external authority's endorsement as the spine of a brand's positioning lets independent proof do the persuading — far more credible, and more defensible, than self-claimed sustainability.\n\nResult. A focused positioning that translated a technical credential into brand reputation and industry visibility — sustainability made believable because someone else vouched for it.`\n      }\n    ],\n\n    \"07\": [\n      {\n        title:  \"EMG · Mitsubishi — Messaging & Spokesperson Media Training\",\n        client: \"Mitsubishi (via EMG)\",\n        year:   \"2024\",\n        tags:   [\"Brand & Communications\",\"Media Production\",\"Account Management\"],\n        tools:  [\"PowerPoint\",\"Word\"],\n        role:   \"Brand & Communications\",\n        desc:   `Challenge. Mitsubishi — a globally recognised brand — was one of the clients in my portfolio at EMG. Work at this level isn't about building awareness; it's about precision and protection. A brand this visible needs its content messaging to stay consistently on-brand, and its high-profile spokespeople and representatives to be well prepared, because with a name this size a single off-message moment carries real reputational weight.\n\nApproach. As part of the account team, contributed across two connected areas: supporting the development and refinement of the messaging for Mitsubishi's content, helping translate the brand's objectives into clear, consistent, on-brand language across materials; and contributing to media training for Mitsubishi's high-profile spokespeople and representatives, helping prepare them to stay on-message, represent the brand consistently, and handle media moments with confidence.\n\nFramework. Message discipline + spokesperson readiness. For a major, high-recognition brand, communications value comes from consistency and control: keeping content precisely on-brand, and aligning what spokespeople say — live and under pressure — with the brand's messaging. Reputation management at both the content and the human level.\n\nResult. As part of the team, helped deliver consistent, on-brand content messaging for a global client and supported the preparation of spokespeople to represent Mitsubishi confidently in high-stakes settings — experience working on a rare, senior-level communications account.`\n      },\n      {\n        title:  \"Strategic Narrative & Message Architecture — OQ (via EMG)\",\n        client: \"OQ (via EMG)\",\n        year: \"2024\",\n        tags:   [\"Brand & Communications\",\"Brand Strategy\"],\n        tools:  [\"PowerPoint\"],\n        role:   \"Brand & Communications\",\n        desc:   `Challenge. OQ needed a communications platform for the GCC's largest energy trade shows — messaging that would land with a high-stakes, technical international audience and give the brand a distinctive voice, rather than the interchangeable corporate-energy language every competitor uses.\n\nApproach. I built the communications around a single strategic narrative: Define the narrative spine. I developed OQ's core storyline and message architecture — one ownable narrative that every communication could ladder back to. Adapt to audience. I tailored the message's expression to a specialist energy audience, balancing technical credibility with brand ambition so it resonated without diluting. Align to objectives. I kept every message tied to OQ's goals for the events, so communications drove visibility and impact rather than just presence.\n\nFramework. Strategic narrative + message architecture. Communications cohere when a brand has one clear story everything ladders back to — a strategic narrative as the organising spine, with a message architecture beneath it adapting that story to each audience and channel. In a crowded, technical category, a clear narrative is itself the differentiator.\n\nResult. A coherent strategic narrative and message architecture that gave OQ an ownable, consistent voice at the region's most important energy events.`\n      }\n    ],\n\n    \"05\": [\n      {\n        title:  \"EMG · Sales Pitching & New-Business Development\",\n        client: \"EMG\",\n        year:   \"2024\",\n        tags:   [\"Account Management\",\"Brand & Communications\"],\n        tools:  [\"PowerPoint\",\"MS Dynamics\",\"Excel\"],\n        role:   \"Account Management\",\n        desc:   `Challenge. An agency only grows when someone can articulate its value and win the work. Beyond delivering for existing clients, EMG needed its services and campaign ideas pitched compellingly to prospective and current clients.\n\nApproach. Presented and helped sell EMG's offering to clients, translating capability into clear business value. Developed and pitched campaign concepts, making the case for the idea and the commercial rationale behind it. Used relationship-building and communication to move clients from interest toward commitment.\n\nFramework. Consultative selling. The strongest pitching isn't a hard sell — it's understanding the client's goal, then framing the service or campaign as the answer. Selling ideas and services through insight and trust, not pressure.\n\nResult. Direct experience pitching services and campaigns to clients — demonstrating commercial and sales capability, not just delivery.`\n      },\n      {\n        title:  \"Global B2B Client Portfolio — EMG\",\n        client: \"EMG\",\n        year: \"2024\",\n        tags:   [\"Account Management\"],\n        tools:  [\"MS Dynamics\",\"Excel\",\"PowerPoint\"],\n        role:   \"Account Management\",\n        desc:   `Challenge. As Account Executive at a B2B agency, I managed relationships for global clients across chemicals, energy, and industrial sectors — accounts where clients wanted creative work that landed and proof it was working. Midway through, my account manager moved into a different role, and I stepped up to carry responsibilities well above my title, including the commercial and budget side of the accounts.\n\nApproach. I ran these accounts as the translator between data, creative, and commercials: Insight into brief. I turned client goals and performance data into clear creative briefs, so the team built against what the numbers said the client needed. Creative into performance. I delivered digital marketing reports that explained the work back to clients in terms of results, connecting ideas to metrics. Own the commercials. I took on budget allocation and pricing across accounts — tracking utilisation so each client's spend was deployed fully and efficiently against plan, setting pricing to scope, and keeping spend accountable and margin protected.\n\nFramework. Trusted-advisor account management + financial stewardship. The strongest account managers pair dual fluency (data + creative) with commercial ownership — managing the client's budget as responsibly as their own, so trust is earned on results and on how their money is spent. Stepping into budget and pricing above my level was where relationship management became true account management.\n\nResult. Strong, lasting client relationships and measurable account growth — recognised directly by my account manager, whose reference credits my initiative on responsibilities beyond my role, my impactful insights on reporting, and my contribution to account growth, noting my potential for more senior roles.`\n      },\n      {\n        title:  \"Trade-Show Account & Campaign Delivery — EMG\",\n        client: \"EMG\",\n        year: \"2024\",\n        tags:   [\"Account Management\",\"Team Management\"],\n        tools:  [\"MS Dynamics\",\"Excel\",\"PowerPoint\"],\n        role:   \"Account Management\",\n        desc:   `Challenge. International trade shows (NPE, ACS, Arabplast, GPCA, Fruit Attraction) are high-stakes client moments — the creative has to land on-site and on-brand, the budget has to hold, and afterwards the client wants proof it worked.\n\nApproach. I ran these as full-loop account engagements, connecting creative, operations, and data: Brief the creative team against each event's strategy, keeping content tailored and coherent. Own the operational and financial spine — logistics, budget management, timelines, and stakeholder alignment — so delivery was seamless and spend stayed on plan. Close the loop with analytics. I analysed and reported post-event media performance, turning each show's results into the insight that briefed the next one.\n\nFramework. End-to-end account ownership with a measurement loop. The account manager holds strategy, creative, budget, logistics, and reporting together — and by feeding performance data back into the next brief, turns one-off delivery into a compounding, insight-led cycle.\n\nResult. Consistently smooth, on-budget delivery across multiple global shows, each one measured and turned into a sharper brief for the next.`\n      },\n      {\n        title:  \"Bridging Analytics, Creative & Commercials In-House — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Account Management\",\"Analytics & Performance\"],\n        tools:  [\"MS Dynamics\",\"GA4\",\"ClickUp\",\"Excel\"],\n        role:   \"Account Management\",\n        desc:   `Challenge. At NOWN I work directly with the CEO, sitting between the numbers, the makers, and the money — using CRM, SEO, and analytics on one side, directing creative and production on the other, and owning a significant amount of the budgeting and financial planning throughout.\n\nApproach. The translator role, now spanning insight, creative, and finance: Data sets the direction. I use CRM and SEO/analytics insight to decide what the work needs to do, so campaigns start from evidence. I brief and direct the creative — teams, developers, production — keeping it coherent across every touchpoint. I own the commercial side. Working directly with the CEO, I handle budgeting and allocation across campaigns and launches — planning spend, tracking utilisation, and managing costs so marketing stays aligned to commercial goals, not just creative ones.\n\nFramework. Full-funnel account ownership + budget accountability. When one person reads the data, sets the brief, directs the creative, and owns the budget, nothing leaks — not effectiveness, and not spend. Reporting directly to the CEO on both the creative output and the numbers behind it is account ownership at its most complete.\n\nResult. Launches and campaigns delivered coherently, measurably, and within budget — one person connecting insight, creative, spend, and results end to end (the ASOFT campaign being one example: a 15% lift in quote requests, with 8% and 5% follower growth).`\n      },\n      {\n        title:  \"NOWN · US Expansion — Sales Enablement for New York\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Account Management\",\"Brand & Communications\",\"Brand Strategy\"],\n        tools:  [\"PowerPoint\",\"MS Dynamics\"],\n        role:   \"Account Management\",\n        desc:   `Challenge. As NOWN expanded into New York, the local sales team needed to sell a rebrand built specifically for the US market — and they needed the messaging, narratives, and strategy to do it convincingly.\n\nApproach. I supported the New York sales team directly:\n\n1. Arm them with the story. Provided pitching content, narratives, and messaging tailored to the US-market rebrand.\n\n2. Shape the go-to-market angle. Developed strategies for how to position and market the rebranding to land with US audiences.\n\n3. Bridge brand and sales. Made sure what the sales team said matched the brand's US positioning — the classic sales-enablement bridge.\n\nFramework. Sales enablement + market-entry positioning. New-market expansion works when the sales team is equipped with a clear, localised story. Enabling sales with the right narratives — built from the brand strategy — is what turns a rebrand into revenue in a new territory.\n\nResult. A New York sales team equipped with the pitching content, narratives, and strategy to sell NOWN's US rebrand — connecting brand positioning to on-the-ground selling in a new market.`\n      }\n    ],\n\n    \"03\": [\n      {\n        title:  \"EMG · Coordinating Creative Teams Across Client Accounts\",\n        client: \"EMG\",\n        year:   \"2024\",\n        tags:   [\"Team Management\",\"Account Management\",\"Content & Copy\"],\n        tools:  [\"MS Dynamics\",\"Excel\",\"PowerPoint\"],\n        role:   \"Team Management\",\n        desc:   `Challenge. Delivering for the clients in my portfolio meant getting work produced by people I didn't formally manage — copywriters, content creators, and more junior team members — often across several accounts at once, to brand standard and on deadline.\n\nApproach. Directed copywriters and content creators, translating each client's goals into clear briefs and assigning tasks to junior team members. Held work to each client's brand standard and on schedule across multiple accounts. Led through influence, getting consistent output from colleagues I didn't line-manage — aligning them through clarity, relationships, and clear expectations.\n\nFramework. Delivery leadership / leading without authority. Coordinating specialists and junior colleagues you don't formally manage runs on briefing clarity, trust, and influence — the account-side discipline of getting the right work out of the right people, on behalf of the client.\n\nResult. Client work delivered to standard and on time across a portfolio of accounts — copywriters, content creators, and junior team members directed and coordinated to keep every account moving.`\n      },\n      {\n        title:  \"LinkedIn Content Engine — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Content & Copy\",\"Social Media\"],\n        tools:  [\"LinkedIn\",\"Adobe Suite\",\"Buffer\"],\n        role:   \"Content & Copy\",\n        desc:   `Challenge. \n\nApproach. \n\nFramework. Mental availability + the value-led content mix (roughly 70/20/10). Consistent presence builds mental availability — being the brand that comes to mind when a specifier has a need. The mix keeps it from being a sales feed: most posts give value or tell a story, a smaller share promote, so the audience keeps showing up rather than tuning out.\n\nResult. A consistent, credible brand voice on LinkedIn with steady audience growth.`\n      },\n      {\n        title:  \"Digital-Literacy Explainer Series & Content — ChatLicense\",\n        client: \"ChatLicense\",\n        year: \"2023\",\n        tags:   [\"Content & Copy\",\"Social Media\"],\n        tools:  [\"Adobe Suite\"],\n        role:   \"Content & Copy\",\n        desc:   `Challenge. \n\nApproach. \n\nFramework. Edutainment + audience-first messaging. Educational content only lands when it's engaging enough to consume by choice, so the copy leads with story and relatability rather than warnings. Every topic is framed from inside the audience's own digital world, which is what makes the message land instead of bounce off.\n\nResult. A body of content that made complex digital-literacy topics genuinely accessible and engaging for a young, native audience — meeting them on their terms, not talking down to them.`\n      },\n      {\n        title:  \"NOWN · US Website — Full Development & Localised Content\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Content & Copy\",\"Brand & Communications\",\"Team Management\",\"Product Management\"],\n        tools:  [\"WordPress\",\"MS Dynamics\",\"Figma\"],\n        role:   \"Content & Copy\",\n        desc:   `Challenge. Expanding to the US market meant NOWN needed its own US website — with a different product portfolio, rebranded messaging, and content tailored to the American market. It had to be built, populated, and made to work end to end.\n\nApproach. I owned the full non-technical development and managed the technical side:\n\n1. Manage the build. Directed the web developer for the technical development of the site (I was their manager for this).\n\n2. Own the CMS and content. Built out the CMS, and created all the content — reflecting the different US product portfolio and the rebranded messaging tailored for the US market.\n\n3. Set up the flows. Configured the mailflow for enquiries and sample requests, so the site actually captured and routed leads.\n\nFramework. Market-localised web delivery + project ownership. Launching in a new market is a full-stack marketing project — product, message, content, and lead capture all localised — with the marketer owning everything but the code and directing the developer for that.\n\nResult. A fully built, US-market website with localised product content, rebranded messaging, working sample-request and enquiry flows — delivered by owning the CMS, content, and flows and managing the developer for the technical build.`\n      }\n    ],\n\n    \"04\": [\n      {\n        title:  \"Veil — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Art Direction\",\"Brand & Communications\"],\n        tools:  [\"Adobe Suite\",\"Figma\"],\n        role:   \"Art Direction\",\n        desc:   `Challenge. A new product launching with a configuration tool — its look had to hold together across a launch film, a digital configurator, print collateral, the website, and the first physical sample. Without one governing visual language, a launch like this fragments.\n\nApproach. I set one visual language and carried it everywhere: I built the brand guidelines from our architectural install manuals — turning a functional artifact into an ownable visual system — then directed the shoot, the configurator's visual design, the pitch decks, brochures, social assets, and the product's web page, overseeing the first production run to test the whole system end to end.\n\nFramework. Distinctive Brand Assets + Integrated Marketing Communications. A multi-surface launch is fundamentally a coherence problem. Distinctive Brand Assets (Ehrenberg-Bass) holds that a brand becomes recognisable through consistent, ownable visual codes repeated across every touchpoint; IMC is the discipline of delivering one identity across all channels. Deriving the system from the install manual created the asset — directing every surface to it was IMC in practice.\n\nResult. A product that launched as one unified brand world — film, interface, web, print, and physical object all speaking the same language.`\n      },\n      {\n        title:  \"Shabab (“Youth”) — Personal Project\",\n        client: \"Personal Project\",\n        year: \"2024\",\n        tags:   [\"Art Direction\",\"Brand Strategy\"],\n        tools:  [\"Adobe Suite\"],\n        role:   \"Art Direction\",\n        desc:   `Challenge. A self-directed brief: create a distinctive visual world that fuses Arabic heritage with a modern aesthetic, entirely from scratch.\n\nApproach. I owned every visual decision — blending photography and graphic design into one coherent aesthetic, directing the mood, palette, and composition to turn a cultural concept into an ownable brand look.\n\nFramework. Semiotics + Cultural Branding. Semiotics studies how visual signs carry meaning; cultural branding (Holt) holds that the strongest brands tap cultural codes and identity, not just product attributes. Together they explain the work: it recodes the signifiers of Arabic heritage through a modern lens, so the visual language means something — youth, identity, tradition meeting modernity — before a word is read.\n\nResult. A distinctive identity bridging tradition and modernity — the clearest proof of my personal taste and point of view.`\n      },\n      {\n        title:  \"NOWN · Spectral Configurator — UI Design (built with Claude Design)\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Art Direction\",\"Product Management\",\"Brand & Communications\"],\n        tools:  [\"Claude Design\",\"Figma\"],\n        role:   \"Art Direction\",\n        desc:   `Challenge. Spectral is a configurator tool that lets customers design their own interior-design products — walls, ceilings, façades, and more. A configurator lives or dies on its interface: it has to make a complex, customisable product feel intuitive and desirable, not overwhelming.\n\nApproach. I designed the tool's UI using Claude Design — shaping the interface, layout, and user flow so customers could move through a complex set of choices (product type, texture, colour, configuration) simply and confidently, all consistent with the brand's visual language.\n\nFramework. UX-led configurator design. A configurator's job is to reduce cognitive load — turning a huge combinatorial space of options into a guided, satisfying experience. Good configurator UI is where product complexity becomes customer confidence.\n\nResult. A clean, on-brand UI for the Spectral configurator that makes designing a custom product feel intuitive — using AI design tools to go from concept to interface.`\n      },\n      {\n        title:  \"NOWN · Automating 300 Product Brochures (built with Claude Design)\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Art Direction\",\"Content & Copy\"],\n        tools:  [\"Claude Design\",\"Adobe Suite\"],\n        role:   \"Art Direction\",\n        desc:   `Challenge. NOWN has around 300 product brochures. Making minor changes across all of them manually is enormously time-consuming and error-prone.\n\nApproach. I used Claude Design to automate minor changes across the full set of ~300 brochures — turning a repetitive, hours-long manual task into a fast, consistent, automated one.\n\nFramework. Design automation / operational efficiency. Applying AI tooling to a high-volume, low-variation production task — the classic automation win: consistency plus time saved, freeing human effort for higher-value work.\n\nResult. Minor updates rolled out across ~300 product brochures efficiently and consistently, saving significant manual time using AI design automation.`\n      },\n      {\n        title:  \"NOWN · The Christmas Tree — A Product Experience in a Box\",\n        client: \"NOWN\",\n        year:   \"2025–2026\",\n        tags:   [\"Art Direction\",\"Brand & Communications\",\"Product Management\"],\n        tools:  [\"Adobe Suite\",\"Hand Production\"],\n        role:   \"Art Direction\",\n        desc:   `Challenge. We wanted a Christmas PR package that did more than land on a desk and get recycled — something that actually made people feel what NOWN is about. The brief I set with our lead designer: don't send a gift, send a miniature version of the whole product experience.\n\nApproach. We designed a Christmas tree made from our own materials — metal and felt — that arrives flat-packed and disassembled, with its own installation manual, exactly like our architectural products do. The recipient doesn't just receive it; they build it. Putting the tree together, manual in hand, becomes a hands-on, small-scale rehearsal of what it's like to work with NOWN — the same materials, the same install ritual, the same satisfaction, shrunk down and wrapped for Christmas.\n\nAnd we made it properly. Nothing was outsourced or rushed: we did everything by hand — the packaging, the spray-painting of the logo, all of it. We went through countless iterations of the tree itself before it was right, ran a batch of tests to choose the exact paper the install manual would be printed on, and obsessed over the details most people would never consciously notice — because those are the details that make something feel considered.\n\nFramework. Experiential / sensory branding. The most memorable brand moments aren't seen, they're done — a brand you physically assemble with your hands leaves a deeper imprint than one you glance at. By turning a PR gift into a build-it-yourself replica of the real product experience (materials, manual, ritual), the package doesn't describe what NOWN is like to work with — it lets you feel it. Craft as the message.\n\nResult. A Christmas PR package that was a product experience in miniature — hand-made, materially true, and assembled by the recipient — turning a seasonal gift into a tactile introduction to the NOWN way of building. The kind of thing people keep, and remember.`\n      }\n    ],\n\n    \"08\": [\n      {\n        title:  \"Explainer & Drama Series (Scripted Video Production) — ChatLicense\",\n        client: \"ChatLicense\",\n        year: \"2023\",\n        tags:   [\"Media Production\",\"Content & Copy\"],\n        tools:  [\"Premiere Pro\",\"After Effects\",\"CapCut\"],\n        role:   \"Media Production\",\n        desc:   `Challenge. Produce a series of scripted explainer and drama videos communicating digital-literacy topics to a young, native audience — requiring real studio production (green screen, crew, multiple shoots) and a finished, engaging series, not one-off clips.\n\nApproach. I worked across the production of the series: Pre-production. Developed the content and scripts, turning each topic into a filmable narrative. Production. Contributed to studio shoots — green-screen setups and on-set coordination — to capture the material. Post-production. Shaped the footage into finished, engaging episodes built to hold attention.\n\nFramework. Narrative-led video production + pre-visualisation. Scripted video works when the story is engineered before the camera rolls — script and shot planning are what make a shoot efficient and an edit coherent. Leading with narrative, then producing to it, is what turns “educational video” into something an audience actually watches.\n\nResult. A finished scripted series that made complex topics genuinely watchable — production capability across scripting, studio shooting, and post.`\n      },\n      {\n        title:  \"Podcast (Full-Stack Production) — ChatLicense\",\n        client: \"ChatLicense\",\n        year: \"2023\",\n        tags:   [\"Media Production\"],\n        tools:  [\"Premiere Pro\",\"Logic Pro\"],\n        role:   \"Media Production\",\n        desc:   `Challenge. Produce a podcast to broadcast standard — clean, hour-long episodes with edited audio and video — owning every stage of the pipeline rather than handing pieces to a separate team.\n\nApproach. I ran the full production loop: Pre-production. Planned and structured each episode and prepared the setup. Production. Set up and operated professional sound equipment, managing the recording environment to capture high-quality audio and video. Post-production. Edited audio and video for each hour-long episode and delivered a polished final cut, handling sound management through to export.\n\nFramework. The three-phase production model (pre → production → post) + audio-first discipline. Professional production lives in the phases most people skip; disciplined pre-production and post are what separate a finished product from a raw recording. In podcasting, audio quality is the retention lever — engineering the sound mattered as much as the edit.\n\nResult. A complete, professionally-produced podcast delivered end to end — proof I can own a production from setup to final cut, not just brief one.`\n      },\n      {\n        title:  \"Brand Story Short Film — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Media Production\",\"Art Direction\",\"Team Management\"],\n        tools:  [\"Premiere Pro\",\"After Effects\",\"CapCut\"],\n        role:   \"Media Production\",\n        desc:   `Challenge. Tell NOWN's story as a brand through a short film — translating an abstract brand narrative into a produced, cinematic piece, and directing a creative team to bring it to life on screen.\n\nApproach. I directed the film end to end: Pre-production. Shaped the brand's story into a film concept and narrative, and planned the shoot. Direction. Led and directed the creative team and crew on set, guiding the shoot to capture the vision. Post-production. Steered the edit into a finished film that delivered the brand story with emotional impact.\n\nFramework. Director-model production + brand storytelling on film. At this level, production is leadership — the director holds the vision and directs specialists to realise it, keeping every department serving one narrative. Applied to a brand, film becomes the most emotionally powerful storytelling format there is, turning an abstract brand identity into something an audience feels.\n\nResult. A finished brand-story short film — directed and delivered by leading a creative team from concept to final cut, proving production capability at the director level.`\n      }\n    ],\n\n    \"09\": [\n      {\n        title:  \"Veil — End-to-End Product Management — NOWN\",\n        client: \"NOWN\",\n        year: \"2025–2026\",\n        tags:   [\"Product Management\",\"Team Management\"],\n        tools:  [\"ClickUp\",\"Figma\"],\n        role:   \"Product Management\",\n        desc:   `Challenge. Veil is a decorative ceiling and wall system that ships with a configuration tool — a digital configurator that lets customers customise the product themselves. Bringing it to market meant owning a genuinely complex product: a physical, manufactured system and a digital software tool, developed and launched together. The CEO assigned me as Product Manager, accountable for taking Veil from concept to market across every function.\n\nApproach. I owned the full product lifecycle, structured across four pillars: Product & production. I drove the product from design through to production — overseeing development of the physical system and production of the first units to validate the whole thing in the real world. Digital product & development. I managed the web developer day to day to build the configuration tool, and contributed to the UI — owning the digital product alongside the physical one, and keeping engineering aligned to what the product needed to do. Go-to-market. I led the promotional content and launch communications, so the product didn't just get built — it landed, with a coherent story around it. Cross-functional
