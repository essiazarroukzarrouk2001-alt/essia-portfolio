document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5c37d550-0e44-4b1d-9808-99a5386cded5\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<script src=\"31ed87b1-9896-4440-8d91-76d29c87aa74\"><\u002Fscript>\n<style>\n  @keyframes fadeUp { from{opacity:0;transform:translateY(32px)} to{opacity:1;transform:translateY(0)} }\n  @keyframes heroFade { 0%{opacity:0;letter-spacing:.35em} 100%{opacity:1;letter-spacing:.18em} }\n  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:.2} }\n  @keyframes dropIn { from{transform:scaleY(0);transform-origin:top} to{transform:scaleY(1);transform-origin:top} }\n\n  /* ── Reset ── */\n  *{margin:0;padding:0;box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{background:#000;color:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;cursor:none;overflow-x:hidden}\n  a{color:inherit;text-decoration:none}\n\n  /* ── Cursor ── */\n  #cursor{position:fixed;width:10px;height:10px;border-radius:50%;background:#C6FF00;pointer-events:none;transform:translate(-50%,-50%);z-index:9999;box-shadow:0 0 14px 5px rgba(198,255,0,.4);transition:width .18s,height .18s}\n  #cursor.big{width:32px;height:32px;background:rgba(198,255,0,.08);box-shadow:0 0 0 1.5px #C6FF00}\n\n  /* ── Nav ── */\n  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 36px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0))}\n  .nav-name{font-weight:700}\n  .nav-back{color:#C6FF00;cursor:pointer}\n\n  /* ── Hero ── */\n  #hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:80px 36px}\n  .hero-eyebrow{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#C6FF00;margin-bottom:28px;opacity:0;animation:fadeUp .9s ease .3s forwards}\n  .hero-title{font-size:clamp(52px,9vw,130px);font-weight:700;letter-spacing:-.045em;line-height:.88;margin-bottom:20px;opacity:0;animation:fadeUp 1s ease .5s forwards}\n  .hero-arabic{font-size:clamp(28px,4.5vw,64px);font-weight:400;letter-spacing:.04em;color:#C6FF00;direction:rtl;margin-bottom:36px;opacity:0;animation:fadeUp .9s ease .75s forwards}\n  .hero-teaser{font-size:clamp(15px,1.6vw,20px);line-height:1.7;color:#aaa;max-width:520px;margin:0 auto 52px;opacity:0;animation:fadeUp .9s ease 1s forwards}\n  .scroll-cue{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#C6FF00;opacity:0;animation:fadeUp .7s ease 1.4s forwards}\n  .scroll-line{width:1px;height:48px;background:linear-gradient(to bottom,#C6FF00,transparent);animation:pulse 2.5s ease-in-out infinite 1.6s}\n  /* Background grid */\n  .hero-grid{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 80px)}\n\n  /* ── Story section ── */\n  #story{position:relative;padding:0 36px 120px;max-width:900px;margin:0 auto;isolation:isolate}\n\n  /* ── Falaj line ── */\n  #falaj-track{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:1px;background:#1a1a1a;z-index:-2}\n  #falaj-fill{position:absolute;left:50%;transform:translateX(-50%);top:0;width:1px;background:#C6FF00;box-shadow:0 0 8px 2px rgba(198,255,0,.5);z-index:-1;height:0%;transition:height .15s linear;pointer-events:none}\n\n  /* ── Beat ── */\n  .beat{position:relative;z-index:2;display:grid;grid-template-columns:1fr 48px 1fr;gap:0 0;margin-bottom:0;padding:80px 0}\n  .beat:last-child{padding-bottom:0}\n\n  /* alternating sides */\n  .beat.left .beat-content{grid-column:1;text-align:right;padding-right:52px}\n  .beat.left .beat-node{grid-column:2}\n  .beat.left .beat-spacer{grid-column:3}\n  .beat.right .beat-spacer{grid-column:1}\n  .beat.right .beat-node{grid-column:2}\n  .beat.right .beat-content{grid-column:3;padding-left:52px}\n\n  .beat-node{display:flex;align-items:center;justify-content:center;padding-top:8px}\n  .beat-dot{width:12px;height:12px;border-radius:50%;background:#000;border:2px solid #333;transition:border-color .4s,box-shadow .4s;flex:none}\n  .beat.revealed .beat-dot{border-color:#C6FF00;box-shadow:0 0 12px 3px rgba(198,255,0,.5)}\n\n  .beat-content{opacity:0;transform:translateY(24px);transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)}\n  .beat.revealed .beat-content{opacity:1;transform:translateY(0)}\n\n  .beat-num{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#C6FF00;margin-bottom:10px}\n  .beat-label{font-size:11px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-bottom:14px}\n  .beat-teaser{font-size:clamp(18px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.22;color:#fff;margin-bottom:18px}\n  .beat-expand-btn{display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#C6FF00;cursor:pointer;border:none;background:none;padding:0;transition:opacity .2s}\n  .beat-expand-btn:hover{opacity:.7}\n  .beat-expand-btn .arr{display:inline-block;transition:transform .35s cubic-bezier(.22,1,.36,1)}\n  .beat-expand-btn.open .arr{transform:rotate(180deg)}\n  .beat-body{overflow:hidden;max-height:0;transition:max-height .6s cubic-bezier(.22,1,.36,1),opacity .5s ease;opacity:0}\n  .beat-body.open{opacity:1}\n  .beat-body p{font-size:15px;line-height:1.9;color:#aaa;padding-top:18px}\n  .beat-body p + p{margin-top:12px}\n\n  /* ── Closing beat (full width) ── */\n  .beat.closing{grid-template-columns:1fr;text-align:center;padding:100px 0 0}\n  .beat.closing .beat-content{grid-column:1;padding:0;text-align:center}\n  .beat.closing .beat-node,.beat.closing .beat-spacer{display:none}\n  .beat.closing .beat-teaser{font-size:clamp(24px,3.5vw,44px)}\n  .beat.closing .beat-num{text-align:center}\n  .beat.closing .beat-label{text-align:center}\n  .beat.closing .beat-expand-btn{margin:0 auto}\n\n  /* ── Closing visual ── */\n  .falaj-close{display:flex;justify-content:center;align-items:center;padding:60px 0 0;gap:0}\n  .falaj-branch{width:1px;height:80px;background:linear-gradient(to bottom,#C6FF00,transparent);opacity:0;transform:scaleY(0);transform-origin:top;transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}\n  .beat.revealed ~ .falaj-close .falaj-branch, .falaj-close.vis .falaj-branch{opacity:1;transform:scaleY(1)}\n  .falaj-close.vis .falaj-branch:nth-child(2){transition-delay:.1s}\n  .falaj-close.vis .falaj-branch:nth-child(3){transition-delay:.2s}\n  .falaj-word{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#C6FF00;padding:0 18px;align-self:center;white-space:nowrap}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- cursor -->\n<div id=\"cursor\"><\u002Fdiv>\n\n<!-- nav -->\n<nav>\n  <a href=\"Personal Page.html\" class=\"nav-back\">← Personal<\u002Fa>\n  <span class=\"nav-name\">Essia Zarrouk<\u002Fspan>\n  <a href=\"index.html\" style=\"color:#fff\">Portfolio<\u002Fa>\n<\u002Fnav>\n\n<!-- hero -->\n<section id=\"hero\">\n  <div class=\"hero-grid\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1\">\n    <div class=\"hero-eyebrow\">Origin Story · Al Jabal Al Akhdar · Oman<\u002Fdiv>\n    <h1 class=\"hero-title\">The Green<br>Mountain<\u002Fh1>\n    <div class=\"hero-arabic\">الجبل الأخضر<\u002Fdiv>\n    <p class=\"hero-teaser\">It rises two thousand metres over the Omani desert, and the name feels like a mistake — until you reach the top.<\u002Fp>\n    <div class=\"scroll-cue\">\n      <span>Follow the water<\u002Fspan>\n      <div class=\"scroll-line\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- story -->\n<section id=\"story\">\n  <div id=\"falaj-track\"><\u002Fdiv>\n  <div id=\"falaj-fill\"><\u002Fdiv>\n\n  <!-- Beat 01 -->\n  <div class=\"beat left\" data-beat=\"0\">\n    <div class=\"beat-content\">\n      <div class=\"beat-num\">[ 01 ]<\u002Fdiv>\n      <div class=\"beat-label\">The Mountain<\u002Fdiv>\n      <div class=\"beat-teaser\">The secret is the aflaj — a two-thousand-year-old network of channels still running today.<\u002Fdiv>\n      <button class=\"beat-expand-btn\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\">\n        <p>They call it Al Jabal Al Akhdar — the Green Mountain. It rises two thousand metres over the Omani desert, and the name feels like a mistake until you reach the top, where orchards and rose gardens spill down slopes that should be bare rock.<\u002Fp>\n        <p>The secret is the aflaj: a two-thousand-year-old network of channels carved into the mountain, still running today, that carries water from hidden underground springs to exactly where it needs to go. No pumps, no machinery — just people who read the land so precisely that gravity does the rest, and shared it so fairly that a whole community could live where nothing should grow.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-spacer\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Beat 02 -->\n  <div class=\"beat right\" data-beat=\"1\">\n    <div class=\"beat-spacer\"><\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-content\">\n      <div class=\"beat-num\">[ 02 ]<\u002Fdiv>\n      <div class=\"beat-label\">The Hike<\u002Fdiv>\n      <div class=\"beat-teaser\">No phone. Just a map, a group of classmates, and no idea where to start.<\u002Fdiv>\n      <button class=\"beat-expand-btn\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\">\n        <p>I hiked that mountain on a school trip as a teenager — no phone, just a map and a group of classmates with no idea where to start. And somewhere on those slopes it clicked, though it took me years to understand why: that mountain is how I work.<\u002Fp>\n        <p>I read the terrain, bring people together, and channel things where they need to go so something actually grows. On that trip, in a group that didn't know where to start, I picked up the map without thinking — sharing out tasks, keeping people calm, getting us moving.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Beat 03 -->\n  <div class=\"beat left\" data-beat=\"2\">\n    <div class=\"beat-content\">\n      <div class=\"beat-num\">[ 03 ]<\u002Fdiv>\n      <div class=\"beat-label\">The Beginning<\u002Fdiv>\n      <div class=\"beat-teaser\">Born in Tunisia, taught in French till six. Then Oman. Then the Netherlands — alone, before eighteen.<\u002Fdiv>\n      <button class=\"beat-expand-btn\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\">\n        <p>Born in Tunisia, taught in French till the age of six, then Oman for a British school. I graduated a year early and moved to the Netherlands on my own, before I turned eighteen. When you grow up switching between languages, countries, and cultures, you learn to read people and earn their trust quickly — and that became my comfort zone.<\u002Fp>\n        <p>It's the real engine of everything I do: understand what someone actually needs, build the relationship, and turn it into something that grows for both sides.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-spacer\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Beat 04 -->\n  <div class=\"beat right\" data-beat=\"3\">\n    <div class=\"beat-spacer\"><\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-content\">\n      <div class=\"beat-num\">[ 04 ]<\u002Fdiv>\n      <div class=\"beat-label\">The Two Halves<\u002Fdiv>\n      <div class=\"beat-teaser\">My father worked in theatre. My mother worked in business. I learned both at the same table.<\u002Fdiv>\n      <button class=\"beat-expand-btn\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\">\n        <p>My father worked in theatre and then cinema, so I was raised around design and story and the craft of making people feel something; I painted, I loved film, and I've never lost the eye for it. My mother worked in business, so at the same table I fell for numbers and the satisfaction of things adding up.<\u002Fp>\n        <p>My A-levels were Economics, Statistics, and Art, and everyone was surprised — but to me it was obvious. One tells you the truth; the other makes people care. I've never treated them as opposites, because relating to people needs both at once.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Beat 05 -->\n  <div class=\"beat left\" data-beat=\"4\">\n    <div class=\"beat-content\">\n      <div class=\"beat-num\">[ 05 ]<\u002Fdiv>\n      <div class=\"beat-label\">The Middle<\u002Fdiv>\n      <div class=\"beat-teaser\">What I do best is sit between people and results — reading the numbers and the room.<\u002Fdiv>\n      <button class=\"beat-expand-btn\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\">\n        <p>What I do best is sit between people and results — building the relationship, reading the numbers and the room, and owning the outcome, with a real feel for design and for brands that stand for something. I'm drawn to work where quality and integrity matter, not just volume.<\u002Fp>\n        <p>I didn't set out to build a career from living in the middle. But it turns out I've been doing it since I was six — and the mountain had the name for it long before I did.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-spacer\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Beat 06 — Closing -->\n  <div class=\"beat right closing\" data-beat=\"5\">\n    <div class=\"beat-spacer\"><\u002Fdiv>\n    <div class=\"beat-node\"><div class=\"beat-dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"beat-content\">\n      <div class=\"beat-num\" style=\"text-align:center\">[ 06 ]<\u002Fdiv>\n      <div class=\"beat-label\" style=\"text-align:center\">The Aflaj<\u002Fdiv>\n      <div class=\"beat-teaser\">The people who built them didn't force water uphill or fight the desert. They read the land, worked together, and guided something precious — gently — to exactly where it could grow.<\u002Fdiv>\n      <button class=\"beat-expand-btn\" style=\"margin:0 auto\"><span>Read more<\u002Fspan><span class=\"arr\">↓<\u002Fspan><\u002Fbutton>\n      <div class=\"beat-body\" style=\"text-align:center\">\n        <p>That's the whole of what I do: read the terrain, bring people with me, and channel the right things to the right places until something takes root and lasts.<\u002Fp>\n        <p style=\"color:#C6FF00;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:28px\">Not new here. But always growing.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Closing visual — branches -->\n  <div class=\"falaj-close\" id=\"falaj-close\">\n    <div class=\"falaj-branch\"><\u002Fdiv>\n    <div class=\"falaj-word\">aflaj<\u002Fdiv>\n    <div class=\"falaj-branch\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // Cursor\n    const cur = document.getElementById('cursor');\n    let lx=0,ly=0,cx=0,cy=0;\n    document.addEventListener('mousemove', e=>{ cx=e.clientX; cy=e.clientY; });\n    const loop = () => {\n      lx+=(cx-lx)*.12; ly+=(cy-ly)*.12;\n      cur.style.left=lx+'px'; cur.style.top=ly+'px';\n      requestAnimationFrame(loop);\n    };\n    loop();\n    document.querySelectorAll('a,button').forEach(el=>{\n      el.addEventListener('mouseenter',()=>cur.classList.add('big'));\n      el.addEventListener('mouseleave',()=>cur.classList.remove('big'));\n    });\n\n    // Expand toggles\n    document.querySelectorAll('.beat-expand-btn').forEach(btn=>{\n      btn.addEventListener('click', ()=>{\n        const body = btn.nextElementSibling;\n        const isOpen = btn.classList.contains('open');\n        if(isOpen){\n          btn.classList.remove('open');\n          btn.querySelector('span').textContent='Read more';\n          body.classList.remove('open');\n          body.style.maxHeight='0';\n        } else {\n          btn.classList.add('open');\n          btn.querySelector('span').textContent='Read less';\n          body.classList.add('open');\n          body.style.maxHeight = body.scrollHeight + 'px';\n        }\n      });\n    });\n\n    // Scroll: falaj fill + beat reveals\n    const story = document.getElementById('story');\n    const fill  = document.getElementById('falaj-fill');\n    const beats = document.querySelectorAll('.beat');\n    const closingVis = document.getElementById('falaj-close');\n\n    const update = () => {\n      const sTop = story.getBoundingClientRect().top;\n      const sH   = story.offsetHeight;\n      const vH   = window.innerHeight;\n      const raw   = (-sTop) / (sH - vH);\n      const pct   = Math.max(0, Math.min(100, raw * 100));\n      fill.style.height = pct + '%';\n\n      beats.forEach(beat=>{\n        const r = beat.getBoundingClientRect();\n        if(r.top < vH * 0.78) beat.classList.add('revealed');\n      });\n\n      const cr = closingVis.getBoundingClientRect();\n      if(cr.top < vH * 0.88) closingVis.classList.add('vis');\n    };\n\n    window.addEventListener('scroll', update, { passive:true });\n    update();\n  }\n  renderVals(){ return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
